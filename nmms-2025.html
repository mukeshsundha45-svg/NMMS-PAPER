<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="artifact-type" content="dashboard">
<meta name="design-style" content="sticker">
<title>NMMS 2024-25 (Set A) — અભ્યાસ અને ગેમ્સ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..900;1,9..40,400..900&family=Noto+Sans+Gujarati:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@1.43.0/dist/umd/lucide.min.js"></script>
<style>
:root {
  color-scheme: light;

  /* 1. Sticker style tokens */
  --background: #fef7ff;
  --surface-container-low: #ffffff;
  --surface-container: #f8eef8;
  --surface-container-high: #f2e8f2;

  --on-surface: #2e1a28;
  --on-surface-variant: #604868;

  --outline: #907898;
  --outline-variant: #dcc8e0;

  --primary: #c2207f;
  --on-primary: #ffffff;
  --primary-container: #f080c0;
  --on-primary-container: #2e1a28;
  --secondary: #7c52aa;
  --tertiary: #0096cc;
  --error: #c53030;
  --on-error: #ffffff;

  --data-1: #c2207f;
  --data-2: #7c52aa;
  --data-3: #0096cc;
  --data-4: #d96a00;
  --data-context: #c8b8d0;

  --font-headline: 'Noto Sans Gujarati', 'DM Sans', sans-serif;
  --font-body: 'Noto Sans Gujarati', 'DM Sans', sans-serif;
  --font-label: 'Noto Sans Gujarati', 'DM Sans', sans-serif;

  --rounded: 1rem;
  --rounded-lg: 2rem;
  --rounded-full: 9999px;

  --shadow-pink: 0 4px 16px rgb(224 64 160 / 0.2);
  --shadow-pink-deep: 0 10px 28px rgb(224 64 160 / 0.32);
  --shadow-grape: 0 4px 16px rgb(124 82 170 / 0.2);
  --shadow-sky: 0 4px 16px rgb(0 150 204 / 0.2);
  --pop-scale: scale(1.03);
  --lift: translateY(-4px);
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* 2. Shared semantic & scale tokens */
  --positive: #15803d;
  --positive-bg: #e7f8ee;
  --warning: #b45309;
  --warning-bg: #fef3c7;
  --error-bg: #fde8e8;
  --sky-bg: #e3f6fd;
  --grape-bg: #f1eafb;
  --focus: #c2207f;

  --display-size: clamp(1.75rem, 1.4rem + 1.2vw, 2.35rem);
  --headline-size: clamp(1.25rem, 1.1rem + 0.5vw, 1.55rem);
  --subhead-size: clamp(1.0625rem, 1rem + 0.25vw, 1.2rem);
  --body-size: clamp(0.95rem, 0.92rem + 0.15vw, 1.05rem);
  --label-size: 0.78rem;

  --space-xs: 0.25rem;
  --space-sm: 0.5rem;
  --space-md: 1rem;
  --space-lg: 1.5rem;
  --space-xl: 2.5rem;
  --space-2xl: 4rem;

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-micro: 120ms;
  --dur-short: 220ms;
  --dur-long: 420ms;
}

/* Base reset */
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; margin: 0; padding: 0; }
header { position: static !important; }

body {
  background: var(--background);
  color: var(--on-surface);
  font-family: var(--font-body);
  font-size: var(--body-size);
  line-height: 1.65;
  letter-spacing: 0;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.page-grid {
  display: grid;
  gap: var(--space-lg);
  padding: var(--space-lg);
  max-width: 1120px;
  margin: 0 auto;
  overflow: hidden;
}
.page-grid * { min-width: 0; }

/* Header / Masthead */
.hero-panel {
  background: var(--surface-container-low);
  border-radius: var(--rounded-lg);
  padding: var(--space-xl);
  box-shadow: var(--shadow-pink);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-lg);
}

.display {
  font-family: var(--font-headline);
  font-weight: 900;
  font-size: var(--display-size);
  line-height: 1.15;
  margin: 0 0 var(--space-xs) 0;
  color: var(--on-surface);
}
.display em {
  font-style: normal;
  color: var(--primary);
}
.hero-sub {
  margin: 0;
  color: var(--on-surface-variant);
  font-size: var(--body-size);
  max-width: 62ch;
}

/* Primary Navigation Tabs */
.nav-tabs {
  display: inline-flex;
  background: var(--surface-container-high);
  padding: var(--space-xs);
  border-radius: var(--rounded-full);
  gap: var(--space-xs);
  box-shadow: var(--shadow-grape);
}
.tab-btn {
  border: none;
  background: transparent;
  color: var(--on-surface-variant);
  font-weight: 700;
  padding: var(--space-sm) var(--space-lg);
  border-radius: var(--rounded-full);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: var(--space-sm);
  min-height: 44px;
  transition: transform var(--dur-short) var(--ease-bounce), background-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out);
}
.tab-btn:hover { transform: var(--pop-scale); }
.tab-btn.active {
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: var(--shadow-pink);
}

/* Buttons & Badges */
.btn {
  border: none;
  border-radius: var(--rounded-full);
  padding: var(--space-sm) var(--space-lg);
  min-height: 44px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  transition: transform var(--dur-short) var(--ease-bounce), box-shadow var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out);
}
.btn:hover:not(:disabled) { transform: var(--pop-scale); }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.48; cursor: not-allowed; }

.btn-primary {
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: var(--shadow-pink);
}
.btn-primary:hover:not(:disabled) { box-shadow: var(--shadow-pink-deep); }

.btn-secondary {
  background: var(--secondary);
  color: var(--on-primary);
  box-shadow: var(--shadow-grape);
}

.btn-soft {
  background: var(--surface-container);
  color: var(--primary);
  border: 2px solid var(--outline-variant);
}
.btn-soft:hover:not(:disabled) {
  background: var(--surface-container-high);
  border-color: var(--primary);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs);
  border-radius: var(--rounded-full);
  padding: var(--space-xs) var(--space-md);
  font-size: var(--label-size);
  font-weight: 700;
  background: var(--primary-container);
  color: var(--on-primary-container);
}
.badge-grape {
  background: var(--grape-bg);
  color: var(--secondary);
  border: 1.5px solid var(--secondary);
}
.badge-positive {
  background: var(--positive-bg);
  color: var(--positive);
}
.badge-warning {
  background: var(--warning-bg);
  color: var(--warning);
}

/* Study Tab: Strictly 2 Filter Controls */
.filters-bar {
  background: var(--surface-container-low);
  border-radius: var(--rounded);
  padding: var(--space-lg);
  box-shadow: var(--shadow-sky);
  display: grid;
  grid-template-columns: minmax(180px, 240px) minmax(0, 1fr);
  gap: var(--space-lg);
  align-items: end;
}
.field-group {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
}
.field-label {
  font-size: var(--label-size);
  font-weight: 700;
  color: var(--on-surface-variant);
}
.pill-input, .pill-select {
  min-height: 44px;
  border-radius: var(--rounded-full);
  background: var(--surface-container);
  border: 2px solid var(--outline);
  padding: var(--space-sm) var(--space-md);
  color: var(--on-surface);
  font-weight: 600;
  width: 100%;
  transition: border-color var(--dur-micro) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out);
}
.pill-select {
  padding-right: var(--space-xl);
  cursor: pointer;
}
.pill-input:focus, .pill-select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: var(--shadow-pink);
}
.search-row {
  display: flex;
  gap: var(--space-sm);
  align-items: center;
}

/* Question Cards */
.questions-stack {
  display: grid;
  gap: var(--space-lg);
}
.q-card {
  background: var(--surface-container-low);
  border-radius: var(--rounded);
  padding: var(--space-lg);
  box-shadow: var(--shadow-pink);
  animation: cardEnter var(--dur-long) var(--ease-out) both;
}
.q-card:nth-child(3n+2) { box-shadow: var(--shadow-sky); }
.q-card:nth-child(3n+3) { box-shadow: var(--shadow-grape); }

.q-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-sm);
  margin-bottom: var(--space-md);
}
.q-num-pill {
  background: var(--secondary);
  color: var(--on-primary);
  font-weight: 800;
  font-size: var(--label-size);
  padding: var(--space-xs) var(--space-md);
  border-radius: var(--rounded-full);
  font-variant-numeric: tabular-nums;
}
.q-text {
  font-size: var(--subhead-size);
  font-weight: 700;
  margin: 0 0 var(--space-md) 0;
  color: var(--on-surface);
  max-width: 70ch;
}
.q-diagram {
  margin: var(--space-md) 0;
  padding: var(--space-md);
  background: var(--surface-container);
  border-radius: var(--rounded);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  max-width: 100%;
}
.options-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
  gap: var(--space-sm);
  margin-bottom: var(--space-md);
}
.opt-chip {
  background: var(--surface-container);
  border-radius: var(--rounded-full);
  padding: var(--space-sm) var(--space-md);
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  border: 2px solid transparent;
  transition: background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
}
.opt-chip.is-correct-reveal {
  background: var(--positive-bg);
  border-color: var(--positive);
  color: var(--positive);
}
.opt-letter {
  width: 28px;
  height: 28px;
  border-radius: var(--rounded-full);
  background: var(--surface-container-low);
  color: var(--secondary);
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.opt-chip.is-correct-reveal .opt-letter {
  background: var(--positive);
  color: var(--on-primary);
}

/* Explanation Drawer Animation */
.explain-box {
  margin-top: var(--space-md);
  background: var(--surface-container);
  border-radius: var(--rounded);
  padding: var(--space-md) var(--space-lg);
  border-left: 5px solid var(--primary);
  animation: stepReveal var(--dur-long) var(--ease-bounce) both;
}
.ans-banner {
  font-weight: 800;
  color: var(--positive);
  margin-bottom: var(--space-sm);
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-sm);
}
.steps-list {
  margin: 0;
  padding-left: var(--space-lg);
  display: grid;
  gap: var(--space-xs);
}
.steps-list li {
  animation: stepFade var(--dur-short) var(--ease-out) both;
}
.steps-list li:nth-child(2) { animation-delay: 80ms; }
.steps-list li:nth-child(3) { animation-delay: 160ms; }
.steps-list li:nth-child(4) { animation-delay: 240ms; }

/* Pagination Bar */
.pagination-bar {
  background: var(--surface-container-low);
  border-radius: var(--rounded-full);
  padding: var(--space-sm) var(--space-md);
  box-shadow: var(--shadow-grape);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-sm);
}
.page-nums {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-xs);
  align-items: center;
}
.page-num-btn {
  min-width: 40px;
  min-height: 40px;
  border-radius: var(--rounded-full);
  border: none;
  background: var(--surface-container);
  font-weight: 700;
  cursor: pointer;
  padding: 0 var(--space-sm);
  transition: transform var(--dur-micro) var(--ease-bounce), background-color var(--dur-micro) var(--ease-out);
}
.page-num-btn:hover { transform: var(--pop-scale); }
.page-num-btn.active {
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: var(--shadow-pink);
}

/* Games Tab HUD (ONLY visible in Games Tab) */
.games-hud {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr));
  gap: var(--space-md);
}
.stat-card {
  background: var(--surface-container-low);
  border-radius: var(--rounded);
  padding: var(--space-md) var(--space-lg);
  box-shadow: var(--shadow-pink);
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
}
.stat-card:nth-child(2) { box-shadow: var(--shadow-sky); }
.stat-card:nth-child(3) { box-shadow: var(--shadow-grape); }
.stat-card:nth-child(4) { box-shadow: var(--shadow-pink); }
.stat-label {
  font-size: var(--label-size);
  font-weight: 700;
  color: var(--on-surface-variant);
}
.stat-val {
  font-size: var(--headline-size);
  font-weight: 900;
  color: var(--primary);
  font-variant-numeric: tabular-nums;
}

.games-menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
  gap: var(--space-lg);
}
.game-tile {
  background: var(--surface-container-low);
  border-radius: var(--rounded);
  padding: var(--space-lg);
  box-shadow: var(--shadow-pink);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: var(--space-md);
  cursor: pointer;
  border: 2px solid transparent;
  text-align: left;
  transition: transform var(--dur-short) var(--ease-bounce), box-shadow var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
}
.game-tile:nth-child(3n+2) { box-shadow: var(--shadow-sky); }
.game-tile:nth-child(3n+3) { box-shadow: var(--shadow-grape); }
.game-tile:hover {
  transform: var(--lift);
  box-shadow: var(--shadow-pink-deep);
}
.game-tile.active-game {
  border-color: var(--primary);
}
.game-tile h3 {
  margin: 0;
  font-size: var(--subhead-size);
  font-weight: 800;
  color: var(--on-surface);
}
.game-tile p {
  margin: 0;
  color: var(--on-surface-variant);
  font-size: 0.92rem;
}

.game-stage {
  background: var(--surface-container-low);
  border-radius: var(--rounded-lg);
  padding: var(--space-xl);
  box-shadow: var(--shadow-grape);
  position: relative;
  overflow: hidden;
}

.game-top-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-md);
  margin-bottom: var(--space-lg);
}

.progress-track {
  width: 100%;
  height: 14px;
  border-radius: var(--rounded-full);
  background: var(--surface-container-high);
  overflow: hidden;
  margin-bottom: var(--space-lg);
}
.progress-fill {
  height: 100%;
  border-radius: var(--rounded-full);
  background: var(--tertiary);
  transition: width var(--dur-short) var(--ease-out);
}

.game-opt-btn {
  width: 100%;
  text-align: left;
  background: var(--surface-container);
  border: 2px solid var(--outline-variant);
  border-radius: var(--rounded-full);
  padding: var(--space-md) var(--space-lg);
  min-height: 48px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: var(--space-md);
  transition: transform var(--dur-short) var(--ease-bounce), background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
}
.game-opt-btn:hover:not(:disabled) {
  transform: var(--pop-scale);
  border-color: var(--primary);
  background: var(--surface-container-low);
}
.game-opt-btn.opt-right {
  background: var(--positive-bg);
  border-color: var(--positive);
  color: var(--positive);
}
.game-opt-btn.opt-wrong {
  background: var(--error-bg);
  border-color: var(--error);
  color: var(--error);
}

/* Game 2: Balloon & Funny Emoji Stage */
.balloon-zone {
  min-height: 88px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-md);
  flex-wrap: wrap;
  margin-bottom: var(--space-md);
  padding: var(--space-md);
  border-radius: var(--rounded);
  background: var(--surface-container);
}
.balloon-pop {
  display: inline-flex;
  align-items: center;
  gap: var(--space-sm);
  font-size: 1.5rem;
  font-weight: 800;
  animation: popUp var(--dur-long) var(--ease-bounce) both;
}

/* Game 3: Racing Track */
.race-track {
  background: var(--surface-container);
  border-radius: var(--rounded);
  padding: var(--space-lg) var(--space-md);
  margin-bottom: var(--space-lg);
  position: relative;
}
.race-lane {
  height: 16px;
  background: var(--surface-container-high);
  border-radius: var(--rounded-full);
  position: relative;
  margin-top: var(--space-lg);
}
.race-car {
  position: absolute;
  top: -28px;
  transform: translateX(-50%);
  font-size: 2rem;
  transition: left var(--dur-long) var(--ease-bounce);
}
.race-finish {
  position: absolute;
  right: 0;
  top: -28px;
  font-size: 1.75rem;
}

/* Game 4 & 5 Interactive Step Visualizer */
.step-cards {
  display: grid;
  gap: var(--space-sm);
  margin-top: var(--space-md);
}
.step-pill {
  background: var(--surface-container);
  border-radius: var(--rounded);
  padding: var(--space-md);
  border-left: 4px solid var(--secondary);
  opacity: 0.4;
  transform: translateY(6px);
  transition: opacity var(--dur-short) var(--ease-out), transform var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out);
}
.step-pill.step-active {
  opacity: 1;
  transform: translateY(0);
  background: var(--sky-bg);
  border-left-color: var(--tertiary);
  font-weight: 700;
}

.shape-svg-wrap {
  background: var(--surface-container);
  border-radius: var(--rounded);
  padding: var(--space-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-md);
  margin-bottom: var(--space-lg);
}

.feedback-toast {
  margin-top: var(--space-md);
  padding: var(--space-md) var(--space-lg);
  border-radius: var(--rounded);
  font-weight: 700;
  animation: stepReveal var(--dur-short) var(--ease-bounce) both;
}
.feedback-ok { background: var(--positive-bg); color: var(--positive); }
.feedback-bad { background: var(--warning-bg); color: var(--warning); }

/* Footer */
.site-footer {
  text-align: center;
  padding: var(--space-xl) var(--space-md) var(--space-lg);
  color: var(--on-surface-variant);
}
.creator-credit {
  display: inline-block;
  background: var(--surface-container-low);
  padding: var(--space-sm) var(--space-xl);
  border-radius: var(--rounded-full);
  box-shadow: var(--shadow-pink);
  color: var(--on-surface);
  font-weight: 900;
  font-size: var(--subhead-size);
}

.hidden { display: none !important; }

@keyframes cardEnter {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes stepReveal {
  from { opacity: 0; transform: scale(0.97) translateY(6px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes stepFade {
  from { opacity: 0; transform: translateX(-6px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes popUp {
  0% { opacity: 0; transform: scale(0.6) translateY(12px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

@media (max-width: 640px) {
  .page-grid { padding: var(--space-sm); gap: var(--space-md); }
  .hero-panel { padding: var(--space-lg); }
  .filters-bar { grid-template-columns: 1fr; }
  .game-stage { padding: var(--space-md); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>
<div class="page-grid">

  <!-- Masthead -->
  <header class="hero-panel">
    <div>
      <h1 class="display">NMMS 2024-25 <em>સરળ ઉકેલ</em></h1>
      <p class="hero-sub">પ્રશ્ન 1 થી 180 (Set A) — સત્તાવાર કી મુજબ સ્ટેપ-બાય-સ્ટેપ અભ્યાસ અને 5 ઇન્ટરેક્ટિવ રમતો</p>
    </div>
    <nav class="nav-tabs" aria-label="મુખ્ય વિભાગો">
      <button type="button" id="tab-study-btn" class="tab-btn active" onclick="switchTab('study')">
        <i data-lucide="book-open" aria-hidden="true"></i>
        <span>અભ્યાસ</span>
      </button>
      <button type="button" id="tab-games-btn" class="tab-btn" onclick="switchTab('games')">
        <i data-lucide="gamepad-2" aria-hidden="true"></i>
        <span>ગેમ્સ</span>
      </button>
    </nav>
  </header>

  <!-- TAB 1: અભ્યાસ (Study Tab) -->
  <main id="study-view">
    <!-- Strictly ONLY 2 controls at top -->
    <section class="filters-bar" aria-label="પ્રશ્ન શોધ અને પેજ નિયંત્રણ">
      <div class="field-group">
        <label class="field-label" for="per-page-select">દર પેજ પર પ્રશ્નો</label>
        <select id="per-page-select" class="pill-select" onchange="changePerPage(this.value)">
          <option value="5">5 પ્રશ્નો</option>
          <option value="10" selected>10 પ્રશ્નો</option>
          <option value="25">25 પ્રશ્નો</option>
          <option value="50">50 પ્રશ્નો</option>
          <option value="all">બધા (180)</option>
        </select>
      </div>

      <div class="field-group">
        <label class="field-label" for="search-jump-input">પ્રશ્ન નંબર (1-180) અથવા શબ્દ લખીને શોધો</label>
        <div class="search-row">
          <input id="search-jump-input" class="pill-input" type="text" placeholder="દા.ત. 49 અથવા ત્રિકોણ અથવા રામાનુજન..." oninput="handleSearchJump(this.value)">
          <button type="button" class="btn btn-soft" onclick="clearSearchJump()" aria-label="શોધ સાફ કરો">સાફ</button>
        </div>
      </div>
    </section>

    <div id="study-status" style="margin-top: var(--space-md); color: var(--on-surface-variant); font-weight: 700;"></div>

    <section id="questions-container" class="questions-stack" style="margin-top: var(--space-md);"></section>

    <nav id="pagination-bar" class="pagination-bar" style="margin-top: var(--space-lg);" aria-label="પેજ બદલો"></nav>
  </main>

  <!-- TAB 2: ગેમ્સ (Games Tab) -->
  <section id="games-view" class="hidden">
    <!-- Score, Streak, Badges, Points ONLY inside Games Tab -->
    <div class="games-hud" aria-label="રમતના પોઇન્ટ અને સ્ટ્રીક">
      <div class="stat-card">
        <span class="stat-label">કુલ પોઇન્ટ</span>
        <span class="stat-val" id="hud-points">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">વર્તમાન સ્ટ્રીક</span>
        <span class="stat-val" id="hud-streak">0 🔥</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">શ્રેષ્ઠ સ્ટ્રીક</span>
        <span class="stat-val" id="hud-best-streak">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">મેળવેલ બેજ</span>
        <span class="stat-val" id="hud-badges" style="font-size: var(--subhead-size);">શરૂઆત 🌟</span>
      </div>
    </div>

    <!-- Exactly 5 Games Selector -->
    <div class="games-menu-grid" style="margin-top: var(--space-lg);">
      <button type="button" class="game-tile active-game" id="tile-speed" onclick="selectGame('speed')">
        <span class="badge">ગેમ 1 • ટાઇમર ક્વિઝ</span>
        <h3>સ્પીડ ચેલેન્જ ક્વિઝ</h3>
        <p>15 સેકન્ડમાં ઝડપથી સાચો જવાબ પસંદ કરો અને બોનસ સ્પીડ પોઇન્ટ મેળવો.</p>
      </button>

      <button type="button" class="game-tile" id="tile-balloon" onclick="selectGame('balloon')">
        <span class="badge badge-grape">ગેમ 2 • ફન રિએક્શન</span>
        <h3>બલૂન અને ફની ઇમોજી ક્વિઝ</h3>
        <p>સાચા જવાબ પર બલૂન ઉજવણી અને ખોટા જવાબ પર ફની ઇમોજી સાથે ટિપ્સ!</p>
      </button>

      <button type="button" class="game-tile" id="tile-race" onclick="selectGame('race')">
        <span class="badge">ગેમ 3 • રેસ ટ્રેક</span>
        <h3>રેસિંગ ચેલેન્જ</h3>
        <p>દરેક સાચા જવાબ સાથે તમારી કાર ફિનિશ લાઇન તરફ આગળ વધશે.</p>
      </button>

      <button type="button" class="game-tile" id="tile-solver" onclick="selectGame('solver')">
        <span class="badge badge-grape">ગેમ 4 • સ્ટેપ એનિમેશન</span>
        <h3>મેથ્સ અને રીઝનિંગ સોલ્વર</h3>
        <p>જવાબ આપો અને સ્ટેપ-બાય-સ્ટેપ ગણતરીનું એનિમેશન જુઓ.</p>
      </button>

      <button type="button" class="game-tile" id="tile-shapes" onclick="selectGame('shapes')">
        <span class="badge badge-positive">ગેમ 5 • વિઝ્યુઅલ પઝલ</span>
        <h3>આકાર શોધ પઝલ ગેમ</h3>
        <p>આકૃતિમાં ચોરસ, ત્રિકોણ કે લંબચોરસ ગણો અને એનિમેટેડ હાઇલાઇટથી સમજો.</p>
      </button>
    </div>

    <!-- Active Game Stage -->
    <div id="game-stage" class="game-stage" style="margin-top: var(--space-lg);"></div>
  </section>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="creator-credit"><strong>CREATED BY MUKESH MAHESHWARI</strong></div>
  </footer>

</div>

<script>
// Compact dataset: [id, question, [optA, optB, optC, optD], answerCode, [steps]]
// All 180 questions faithfully grounded in NMMS 2024-25 (Set A) source text
const Q_DATA = [
  [1, `ક્રમમાં આગળનો નંબર: 3, 6, 12, 24, 48, ....?`, [`100`,`96`,`64`,`72`], `B`, [`દરેક સંખ્યા પહેલાની સંખ્યા કરતાં 2 ગણી છે: 3×2=6, 6×2=12, 12×2=24, 24×2=48.`, `એટલે 48 × 2 = 96.`]],
  [2, `ક્રમમાં આગળની સંખ્યા: 1, 1, 2, 9, 5, 8, ....?`, [`13`,`11`,`10`,`9`], `G`, [`પ્રશ્નમાં છાપભૂલ છે: "9" ની જગ્યાએ "3" હોવું જોઈએ (ફિબોનાચી શ્રેણી: 1, 1, 2, 3, 5, 8).`, `સાચી શ્રેણી મુજબ 5+8 = 13 આવે, પણ છાપભૂલને કારણે બોર્ડે ગ્રેસ (બધાને ગુણ) આપ્યા.`]],
  [3, `પેટર્નમાં આગળની સંખ્યા: 3, 9, 27, 81, ....?`, [`243`,`256`,`225`,`200`], `A`, [`દરેક વખતે 3 વડે ગુણાય છે: 3×3=9, 9×3=27, 27×3=81.`, `81 × 3 = 243.`]],
  [4, `પૃથ્વી પર પર્વતમાળાઓની પેટર્નનું શ્રેષ્ઠ વર્ણન:`, [`રેન્ડમ`,`ગોળાકાર`,`રેખીય`,`અનિયમિત`], `AD`, [`પર્વતમાળાઓ કોઈ નિશ્ચિત ગોઠવણી વગર જુદી જુદી જગ્યાએ અને દિશામાં ફેલાયેલી છે.`, `સત્તાવાર કી મુજબ (A) રેન્ડમ અને (D) અનિયમિત બંને માન્ય છે.`]],
  [5, `કયો આકાર ખંડ (એશિયા, આફ્રિકા, યુરોપ વગેરે) ની સીમાને શ્રેષ્ઠ રીતે રજૂ કરે?`, [`ચોરસ`,`ત્રિકોણાકાર`,`અનિયમિત`,`ગોળાકાર`], `C`, [`ખંડોની સીમાઓ વાંકીચૂકી હોય છે, જેમાં અખાત, ખાડી અને દ્વીપકલ્પ હોય છે.`, `તેને ચોરસ, ત્રિકોણ કે ગોળ આકારમાં ગોઠવી શકાતી નથી.`]],
  [6, `છ બાજુઓવાળા બહુકોણનું નામ શું છે?`, [`સાર્થકકોણ`,`અષ્ટકોણ`,`પંચકોણ`,`ષટ્કોણ`], `D`, [`ષટ્ = 6, એટલે 6 બાજુવાળો આકાર ષટ્કોણ.`, `અષ્ટકોણ = 8 બાજુ, પંચકોણ = 5 બાજુ.`]],
  [7, `નિયમિત ષટ્કોણમાં ખૂણાઓ માટે શું સાચું છે?`, [`90°`,`60°`,`120°`,`180°`], `C`, [`નિયમિત બહુકોણનો દરેક ખૂણો = (n − 2) × 180° ÷ n.`, `n = 6 મૂકતાં: (6 − 2) × 180 ÷ 6 = 720 ÷ 6 = 120°.`]],
  [8, `ચોરસને તેના કેન્દ્રની આસપાસ 90° ફેરવવાથી કઈ આકૃતિ બને?`, [`લંબચોરસ`,`ચોરસ`,`સમભુજ`,`પેન્ટાગોન`], `B`, [`ચોરસની ચારે બાજુ અને ચારે ખૂણા સમાન હોય છે.`, `90° ફેરવવાથી એ જ ચોરસ મળે છે, આકાર બદલાતો નથી.`]],
  [9, `ષટ્કોણમાં કર્ણની સંખ્યા કેટલી છે?`, [`9`,`12`,`6`,`8`], `G`, [`સૂત્ર: n(n − 3) ÷ 2 = 6 × 3 ÷ 2 = 9, જે વિકલ્પ (A) છે.`, `સત્તાવાર કીમાં ગ્રેસ આપ્યા છે, એટલે બધાને ગુણ મળશે.`]],
  [10, `પુસ્તક : વાંચન :: ચમચી : ....?`, [`ચમચીદોડ`,`લેખન`,`હલાવવું`,`ખાવું`], `D`, [`પુસ્તકનું મુખ્ય કાર્ય વાંચવા માટે છે, તેમ ચમચીનું કાર્ય ખાવા માટે છે.`]],
  [11, `જો લાઇટ ચાલુ હોય, તો સ્વીચ ચાલુ જ હોય. મેં જોયું કે સ્વીચ ચાલુ છે. ચોક્કસ શું કહી શકાય?`, [`લાઇટ ચાલુ છે`,`લાઇટ બંધ છે`,`લાઇટ ચાલુ હોઈ શકે કે ન પણ હોઈ શકે`,`લાઇટ ચોક્કસ બંધ છે`], `C`, [`નિયમ: લાઇટ ચાલુ → સ્વીચ ચાલુ. ઊલટું જરૂરી નથી.`, `સ્વીચ ચાલુ હોય છતાં બલ્બ ફ્યુઝ હોઈ શકે અથવા વીજળી ગઈ હોઈ શકે.`]],
  [12, `સસ્તન પ્રાણીને રૂંવાટી/વાળ હોય છે. કૂતરો સસ્તન પ્રાણી છે. કૂતરા વિશે શું અનુમાન થાય?`, [`કૂતરાને રૂંવાટી કે વાળ હોય છે`,`નથી હોતા`,`દાંત તીક્ષ્ણ છે`,`હાંફતી વખતે જીભ બહાર રહે છે`], `A`, [`નિયમ: સસ્તન → રૂંવાટી. કૂતરો સસ્તન છે, એટલે તેને રૂંવાટી હોય.`]],
  [13, `બધાં ગુલાબ ફૂલ છે અને કેટલાંક ફૂલ ઝડપથી ઝાંખાં પડે છે. સાચો નિષ્કર્ષ?`, [`કેટલાંક ગુલાબ ઝડપથી ઝાંખાં પડે છે`,`કોઈ ગુલાબ ઝાંખાં પડતાં નથી`,`બધાં ગુલાબ ઝાંખાં પડે છે`,`કેટલાંક ફૂલો ગુલાબ નથી`], `A`, [`ગુલાબ ફૂલોનો જ ભાગ છે અને કેટલાંક ફૂલ ઝાંખાં પડે છે, એટલે કેટલાંક ગુલાબ પણ ઝાંખાં પડે એમ મનાય છે.`]],
  [14, `"પુષ્કળ" સાથે સૌથી વધુ મળતો શબ્દ:`, [`દુર્લભ`,`પૂરગ્રસ્ત`,`ઘણું વધારે`,`પૂરતું`], `C`, [`પુષ્કળ = ખૂબ વધારે, ભરપૂર (ઘણું વધારે).`, `દુર્લભ વિરોધી શબ્દ છે.`]],
  [15, `બે ટ્રેન એકબીજા તરફ 50 kph અને 60 kph ની ઝડપે, શરૂઆતમાં 220 કિમી દૂર. મળવામાં કેટલો સમય?`, [`2 કલાક`,`2.5 કલાક`,`3 કલાક`,`3.5 કલાક`], `A`, [`સામસામે જતી ટ્રેનોની ઝડપ ઉમેરાય: 50 + 60 = 110 km/h.`, `સમય = અંતર ÷ ઝડપ = 220 ÷ 110 = 2 કલાક.`]],
  [16, `શર્મિષ્ઠા > આરતી, આરતી > ગીતા, ગીતા > લીલા (ઉંમરમાં મોટી). સાચું વિધાન?`, [`શર્મિષ્ઠા લીલા કરતાં નાની`,`શર્મિષ્ઠા લીલા કરતાં મોટી`,`આરતી શર્મિષ્ઠા કરતાં મોટી`,`લીલા આરતી કરતાં મોટી`], `B`, [`ક્રમ: શર્મિષ્ઠા > આરતી > ગીતા > લીલા.`, `શર્મિષ્ઠા સૌથી મોટી અને લીલા સૌથી નાની છે.`]],
  [17, `મહિલા કહે છે, "આ મારા પતિના ભાઈની પત્ની છે." તેનો સંબંધ?`, [`નણંદ`,`પુત્રવધૂ`,`દેરાણી`,`સાસુ`], `C`, [`પતિનો ભાઈ = દિયર/જેઠ, અને તેની પત્ની = દેરાણી/જેઠાણી.`]],
  [18, `શ્રેણીમાં ખૂટતો નંબર: 1, 3, 7, 15, 31, ....?`, [`61`,`63`,`65`,`67`], `B`, [`તફાવત: 2, 4, 8, 16 (દર વખતે બમણો થાય છે), એટલે હવે 32.`, `31 + 32 = 63.`]],
  [19, `સમસ્યા હલ કરવાનો સૌથી તાર્કિક રસ્તો:`, [`અનુમાન કરી શ્રેષ્ઠની આશા રાખવી`,`પેટર્ન શોધવી અને કારણો સમજવા`,`ભૂતકાળના અનુભવો અવગણવા`,`ચકાસણી વિના બીજાના મંતવ્ય પર આધાર રાખવો`], `B`, [`તાર્કિક રીત એટલે નિરીક્ષણ, પેટર્ન શોધવી અને કારણ-પરિણામ સમજવાં.`]],
  [20, `જટિલ સમસ્યામાં વિવેચનાત્મક વિચારસરણીનું પ્રથમ પગલું:`, [`નિષ્કર્ષ પર જાઓ`,`માહિતી એકત્રિત કરો અને સમસ્યાને સમજો`,`જાતે વિચાર્યા વિના બીજાના મંતવ્ય પૂછો`,`સમસ્યાને અવગણો`], `B`, [`પહેલાં સમસ્યા સમજવી અને માહિતી ભેગી કરવી, પછી વિશ્લેષણ કરવું.`]],
  [21, `મિત્ર કહે છે ગાજર ખાવાથી દૃષ્ટિ સુધરે છે. દાવાનું મૂલ્યાંકન કરવાનો શ્રેષ્ઠ અભિગમ:`, [`મિત્રએ કહ્યું એટલે સાચું માનો`,`વિશ્વસનીય સ્રોતોમાં વૈજ્ઞાનિક પુરાવા શોધો`,`મિત્રને કહો કે તે ખોટો છે`,`અવગણો`], `B`, [`કોઈ પણ દાવો પુરાવા અને વિશ્વસનીય વૈજ્ઞાનિક સ્રોતથી તપાસીને જ સ્વીકારાય.`]],
  [22, `મુશ્કેલ પરિસ્થિતિમાં નિર્ણય લેતી વખતે શું કરવું?`, [`ફક્ત લાગણીના આધારે`,`ફાયદા-ગેરફાયદાનું વિશ્લેષણ અને લાંબા ગાળાના પરિણામોનો વિચાર`,`બીજા કરે તેમ કરવું`,`તણાવ ટાળવા ઝડપથી નિર્ણય`], `B`, [`સારો નિર્ણય વિચારપૂર્વક, ફાયદા-ગેરફાયદા તોલીને અને ભવિષ્યના પરિણામો જોઈને લેવાય.`]],
  [23, `"2 રબરની કિંમત રૂ. 1.50 તો 10 રબરની કિંમત?" ઉકેલવાની સૌથી સારી રીત:`, [`1.50 × 10`,`1.50 ÷ 2 પછી × 10`,`10 ÷ 2 કેલ્ક્યુલેટરથી`,`1.50 ને દસ વાર ઉમેરો`], `B`, [`પહેલાં 1 રબર: 1.50 ÷ 2 = રૂ. 0.75.`, `પછી 10 રબર: 0.75 × 10 = રૂ. 7.50.`]],
  [24, `વસ્તુની કિંમત 25% વધે અને પછી 25% ઘટે તો કુલ શું થાય?`, [`25% વધે`,`25% ઘટે`,`એ જ રહે`,`25% થી વધુ ઘટે`], `G`, [`100 → +25% = 125 → −25% = 93.75 (કુલ 6.25% ઘટાડો).`, `ચારમાંથી એક પણ વિકલ્પ સાચો ન હોવાથી બોર્ડે ગ્રેસ આપ્યા.`]],
  [25, `પિતાની ઉંમર દીકરા કરતાં 5 ગણી છે. 20 વર્ષ પછી પિતા દીકરા કરતાં 3 ગણા મોટા થશે. પિતાની હાલની ઉંમર?`, [`80`,`90`,`100`,`110`], `C`, [`દીકરો = x, પિતા = 5x. 20 વર્ષ પછી: 5x + 20 = 3(x + 20).`, `5x + 20 = 3x + 60 → 2x = 40 → x = 20.`, `પિતા = 5 × 20 = 100 વર્ષ.`]],
  [26, `જયકુમાર કોકિલાબેનના પુત્ર છે. દક્ષાબેન કોકિલાબેનની બહેન છે. રઈબેન દક્ષાબેનનાં માતા છે. સુરેશભાઈ રઈબેનના પુત્ર છે. સાચું વિધાન?`, [`જયકુમાર અને સુરેશભાઈ પિતરાઈ ભાઈઓ`,`સુરેશભાઈ જયકુમારના મામા`,`દક્ષાબેન જયકુમારની ફોઈ`,`કોકિલાબેન અને સુરેશભાઈ પિતરાઈ`], `B`, [`સુરેશ રઈબેનનો પુત્ર એટલે કોકિલાબેનનો ભાઈ.`, `જયકુમાર કોકિલાબેનનો પુત્ર એટલે માતાનો ભાઈ = મામા.`]],
  [27, `માર્ચ : ઓગસ્ટ :: C : ....?`, [`G`,`I`,`H`,`J`], `C`, [`માર્ચ 3 જો મહિનો, ઓગસ્ટ 8 મો (+5).`, `C (3) + 5 = 8 મો અક્ષર H.`]],
  [28, `10 cm × 8 cm × 8 cm ના લંબઘનને 2 cm બાજુવાળા સમઘનમાં વિભાજિત કરતાં કુલ કેટલા સમઘન બને?`, [`70`,`60`,`88`,`80`], `D`, [`ભાગ: (10÷2) × (8÷2) × (8÷2) = 5 × 4 × 4 = 80.`]],
  [29, `5⁴ અને 4⁵ વચ્ચે કયો સંબંધ સાચો?`, [`=`,`<`,`>`,`લગભગ =`], `B`, [`5⁴ = 625 અને 4⁵ = 1024.`, `625 < 1024, એટલે 5⁴ < 4⁵.`]],
  [30, `દીપકભાઈ રવિભાઈના ભાઈ છે. રેખાબેન અતુલભાઈનાં બહેન છે. રવિભાઈ રેખાબેનના પુત્ર છે. દીપકભાઈ રેખાબેનના શું થાય?`, [`પુત્ર`,`ભાઈ`,`ભાણા`,`માતા`], `A`, [`રવિ રેખાબેનનો પુત્ર છે અને દીપક રવિનો ભાઈ છે, એટલે દીપક પણ રેખાબેનનો પુત્ર થાય.`]],
  [31, `મીઠું : NaCl :: પાણી : ....?`, [`H₃O⁺`,`NaOH`,`H₂O`,`OH⁻`], `C`, [`મીઠાનું રાસાયણિક સૂત્ર NaCl છે, તેમ પાણીનું સૂત્ર H₂O છે.`]],
  [32, `રાષ્ટ્રીય વિજ્ઞાન દિવસ : 28 ફેબ્રુઆરી :: રાષ્ટ્રીય ગણિત દિવસ : ....?`, [`22 માર્ચ`,`22 ઓગસ્ટ`,`22 સપ્ટેમ્બર`,`22 ડિસેમ્બર`], `D`, [`ગણિતશાસ્ત્રી શ્રીનિવાસ રામાનુજનનો જન્મદિવસ 22 ડિસેમ્બર રાષ્ટ્રીય ગણિત દિવસ તરીકે ઉજવાય છે.`]],
  [33, `સવારે 9:00 વાગે પાયલ મેદાનમાં ઊભી છે. તેનો પડછાયો કઈ દિશામાં પડશે?`, [`પૂર્વ`,`પશ્ચિમ`,`ઉત્તર`,`દક્ષિણ`], `B`, [`સવારે સૂર્ય પૂર્વ દિશામાં હોય છે, એટલે પડછાયો વિરુદ્ધ દિશા (પશ્ચિમ) માં પડે.`]],

  [35, `ACE, FHJ, KMO, ....?`, [`PQR`,`QRS`,`PRT`,`SRQ`], `C`, [`ક્રમાંક: ACE(1,3,5), FHJ(6,8,10), KMO(11,13,15).`, `આગળ 16, 18, 20 = P, R, T = PRT.`]],
  [36, `Ant, Apple, Animal, Arrange, Accept ને શબ્દકોશ ક્રમમાં ગોઠવો.`, [`Animal, Apple, Ant, Accept, Arrange`,`Arrange, Ant, Apple, Accept, Animal`,`Accept, Animal, Ant, Apple, Arrange`,`Apple, Ant, Animal, Accept, Arrange`], `C`, [`બીજો અક્ષર: Accept(c), Animal(ni), Ant(nt), Apple(p), Arrange(r).`, `સાચો ક્રમ: Accept, Animal, Ant, Apple, Arrange.`]],

  [38, `QUESTION નું જળપ્રતિબિંબ શોધો.`, [`વિકલ્પ A (દર્પણ)`,`વિકલ્પ B (આડું)`,`વિકલ્પ C (ઊલટું ક્રમ)`,`વિકલ્પ D (ઉપર-નીચે ઊલટું, ક્રમ એ જ)`], `D`, [`જળપ્રતિબિંબમાં અક્ષરો ઉપર-નીચે ઊલટા દેખાય, પણ ડાબેથી જમણે ક્રમ એ જ રહે.`]],
  [39, `આપેલ આકૃતિનું જળપ્રતિબિંબ શોધો. (ડાબી બાજુ પટ્ટી, ઉપર ત્રાંસી રેખા, નીચે ▷)`, [`વિકલ્પ A (પટ્ટી ડાબે, ▷ ઉપર, ત્રાંસી રેખા નીચે)`,`વિકલ્પ B`,`વિકલ્પ C`,`વિકલ્પ D`], `A`, [`જળપ્રતિબિંબમાં ઉપર-નીચે ફરે છે, ડાબી-જમણી બાજુ બદલાતી નથી.`, `એટલે પટ્ટી ડાબે જ રહે, ▷ ઉપર આવે અને ત્રાંસી રેખા નીચે જાય.`]],
  [40, `પારદર્શક કાગળને જમણેથી ડાબે ફોલ્ડ કરતાં કેવી આકૃતિ દેખાશે? (ચોરસમાં ત્રાંસી રેખા, વચ્ચે ટપકાંવાળી ઊભી રેખા)`, [`વિકલ્પ A (">" જેવી આકૃતિ)`,`વિકલ્પ B`,`વિકલ્પ C`,`વિકલ્પ D`], `A`, [`જમણો ભાગ ડાબા પર વળતાં બંને ત્રાંસી રેખાઓ ફોલ્ડ પર મળી ">" આકાર બનાવે.`]],
  [41, `તારાની આકૃતિમાં 54, 162, 18, 6, 2 અને ? છે. ? ની જગ્યાએ શું આવે?`, [`169`,`486`,`480`,`500`], `B`, [`2 → 6 → 18 → 54 → 162 → ? (દરેક વખતે × 3).`, `162 × 3 = 486.`]],
  [42, `આકૃતિમાં કુલ કેટલા ચોરસ છે? (મોટો ચોરસ, વચ્ચે કાટખૂણે બે રેખા, કેન્દ્રમાં નાનો ચોરસ)`, [`8`,`7`,`10`,`12`], `C`, [`મોટો ચોરસ: 1 + મોટા ચોરસના 4 ભાગ + વચ્ચેનો નાનો ચોરસ: 1 + નાનાના 4 ભાગ = 10.`]],
  [43, `શ્રેણી પૂર્ણ કરો: 1Z, 3X, 5V, ....`, [`6U`,`7T`,`7W`,`6T`], `B`, [`સંખ્યા +2: 1, 3, 5, 7. અક્ષર −2: Z, X, V, T. એટલે 7T.`]],
  [44, `શ્રેણી પૂર્ણ કરો: 1/2, 3/2, 5/2, 7/2, ....`, [`8/2`,`7/3`,`9/3`,`9/2`], `D`, [`છેદ 2 સ્થિર છે. અંશ 1, 3, 5, 7 (+2) → 9. એટલે 9/2.`]],
  [45, `શ્રેણી પૂર્ણ કરો: B, H, M, Q, T, ....`, [`U`,`W`,`V`,`X`], `C`, [`ક્રમાંક: 2, 8, 13, 17, 20. તફાવત: 6, 5, 4, 3, હવે 2 → 20+2 = 22 = V.`]],
  [46, `આકૃતિમાં વધુમાં વધુ કેટલા લંબચોરસ છે?`, [`6`,`8`,`9`,`10`], `G`, [`સત્તાવાર કીમાં ગ્રેસ આપ્યા છે (બધાને ગુણ).`]],
  [47, `આકૃતિમાં વધુમાં વધુ કેટલા ચોરસ છે? (હરોળમાં 1, 3, 5, 3, 1 ખાનાં)`, [`22`,`18`,`20`,`16`], `B`, [`1×1 ના ચોરસ: 1+3+5+3+1 = 13.`, `2×2 ના ચોરસ: 4, અને 3×3 નો ચોરસ: 1.`, `કુલ = 13 + 4 + 1 = 18.`]],
  [48, `PICTURE ના મૂળાક્ષરોને અંગ્રેજી ક્રમમાં ગોઠવો.`, [`CEIPRUT`,`CEIRUTP`,`CEIPRTU`,`CEIPURT`], `C`, [`A-Z ક્રમમાં: C, E, I, P, R, T, U = CEIPRTU.`]],
  [49, `100 મીટર લાંબી ટ્રેન 150 મીટર લાંબા પ્લેટફોર્મની બરાબર મધ્યમાં ઊભી છે. સંપૂર્ણ બહાર નીકળવા ઓછામાં ઓછું કેટલું અંતર કાપવું પડે?`, [`100 મી`,`125 મી`,`150 મી`,`175 મી`], `B`, [`બંને બાજુ ખાલી પ્લેટફોર્મ = (150 − 100) ÷ 2 = 25 મી.`, `કુલ અંતર = 25 મી + ટ્રેનની લંબાઈ 100 મી = 125 મીટર.`]],
  [50, `ફળોને મોટાથી નાના કદના ક્રમમાં ગોઠવો: A. લીંબુ, B. તડબૂચ, C. કેરી, D. દ્રાક્ષ.`, [`D, B, A, C`,`D, A, B, C`,`D, A, C, B`,`B, C, A, D`], `D`, [`તડબૂચ (B) > કેરી (C) > લીંબુ (A) > દ્રાક્ષ (D).`]],

  [85, `આકૃતિમાં કઈ સંખ્યા એવી છે જે બધી જ આકૃતિમાં આવે છે?`, [`3`,`5`,`6`,`19`], `A`, [`લંબચોરસ, વર્તુળ, નળાકાર અને ત્રિકોણ ચારેયના સામાન્ય ભાગમાં 3 છે.`]],
  [86, `આકૃતિમાં 3, 8, ?, 125, 27, 2, 4, 5 છે. ? ની જગ્યાએ શું આવે?`, [`8`,`16`,`64`,`32`], `C`, [`સામસામે ઘન: 3↔27 (3³), 5↔125 (5³), 2↔8 (2³). એટલે 4 ની સામે 4³ = 64.`]],
  [87, `પહેલી ત્રણ આકૃતિઓ (બહાર-અંદર આકારની અદલાબદલી) પરથી ? ની જગ્યાએ સાચો વિકલ્પ શોધો.`, [`વિકલ્પ A (બહાર ચોરસ હેચિંગ, અંદર સફેદ વર્તુળ)`,`વિકલ્પ B`,`વિકલ્પ C`,`વિકલ્પ D`], `A`, [`બહાર અને અંદરના આકાર અદલાબદલી થાય છે: બહાર વર્તુળ, અંદર ચોરસ → બહાર ચોરસ, અંદર વર્તુળ.`]],
  [88, `પહેલી ત્રણ આકૃતિઓ (તારો અને તેમાંથી ઘટતી રેખાઓ) પરથી ? ની જગ્યાએ સાચો વિકલ્પ શોધો.`, [`વિકલ્પ A`,`વિકલ્પ B (બે રેખાઓવાળો "∧" આકાર)`,`વિકલ્પ C`,`વિકલ્પ D`], `B`, [`ક્રમશઃ રેખાઓ ઘટતી જાય છે; કી મુજબ ચોથી આકૃતિ "∧" આકારની (B) છે.`]],
  [89, `એક સ્ત્રી પુરુષને આંગળી ચીંધી કહે છે કે તેના ભાઈનો પિતા એ મારા દાદાનો એકમાત્ર પુત્ર છે. સ્ત્રીનો પુરુષ સાથે સંબંધ?`, [`પુરુષની મામી`,`પુરુષની દીકરી`,`પુરુષની બહેન`,`પુરુષની મા`], `C`, [`પુરુષના ભાઈનો પિતા = પુરુષના પિતા; સ્ત્રીના દાદાનો એકમાત્ર પુત્ર = સ્ત્રીના પિતા. એટલે સ્ત્રી બહેન થાય.`]],
  [90, `ક્રમિક 1 થી 20 સંખ્યાનો સરવાળો કેટલો થશે?`, [`200`,`210`,`220`,`420`], `B`, [`સૂત્ર: n(n+1) ÷ 2 = 20 × 21 ÷ 2 = 210.`]],
  [91, `ત્રિકોણોમાં (84, 14, 12), (81, 18, 9), (88, ?, 11). ? = ?`, [`16`,`8`,`18`,`9`], `A`, [`નિયમ: ડાબી = (જમણી × નીચે) ÷ 2. એટલે ? × 11 ÷ 2 = 88 → ? = 16.`]],
  [92, `ત્રણ ચોકઠાં: [4 8 / 3 2], [9 7 / 6 3], [5 9 / ? 5]. ? = ?`, [`2`,`3`,`4`,`5`], `C`, [`ઉપરની બે સંખ્યાનો ગુણાકાર નીચે લખ્યો છે: 4×8=32, 9×7=63, 5×9=45 → ?=4.`]],
  [93, `જૈમિન પાસે 21.6 મીટર લાંબું કાપડ છે. તેમાંથી 1.8 મીટરના કેટલા ટુકડા બને?`, [`10`,`12`,`20`,`16`], `B`, [`21.6 ÷ 1.8 = 216 ÷ 18 = 12 ટુકડા.`]],
  [94, `1/2 અને 1/3 ની સરાસરી શોધો.`, [`1/6`,`5/6`,`2/6`,`5/12`], `D`, [`(1/2 + 1/3) ÷ 2 = (5/6) ÷ 2 = 5/12.`]],
  [95, `બાજુઓના માપની દૃષ્ટિએ કયો ત્રિકોણ શક્ય નથી?`, [`2, 3, 5 સે.મી.`,`3, 6, 7 સે.મી.`,`8, 6, 10 સે.મી.`,`10.2, 5.8, 4.5 સે.મી.`], `A`, [`બે બાજુનો સરવાળો ત્રીજીથી વધુ હોવો જોઈએ; અહીં 2 + 3 = 5 (વધુ નથી), એટલે શક્ય નથી.`]],
  [96, `એક દુકાનદાર 150 રૂ. કિંમતનું રમકડું 22% ખોટ ખાઈને વેચે છે. વેચાણ કિંમત કેટલી?`, [`130 રૂ.`,`183 રૂ.`,`117 રૂ.`,`127 રૂ.`], `C`, [`ખોટ = 150 × 22 ÷ 100 = 33 રૂ. વેચાણ કિંમત = 150 − 33 = 117 રૂ.`]],
  [97, `સંમેય સંખ્યાઓને ચડતા ક્રમમાં ગોઠવો: −3/7, −3/2, −3/4, −3/11.`, [`−3/7, −3/4, −3/2, −3/11`,`−3/11, −3/7, −3/4, −3/2`,`−3/4, −3/2, −3/11, −3/7`,`−3/2, −3/4, −3/7, −3/11`], `D`, [`દશાંશમાં: −1.5 < −0.75 < −0.43 < −0.27 → −3/2, −3/4, −3/7, −3/11.`]],
  [98, `ઘનની ધાર, ફલક અને શિરોબિંદુની અનુક્રમે સંખ્યા?`, [`15, 7, 10`,`12, 6, 8`,`15, 6, 11`,`8, 6, 12`], `B`, [`ઘનને 12 ધાર, 6 ફલક અને 8 શિરોબિંદુ હોય છે.`]],
  [99, `[7/3 × (−6/13)] + [7/5 × 6/13] = ?`, [`0`,`42/65`,`84/65`,`1`], `G`, [`−14/13 + 42/65 = −28/65, જે વિકલ્પોમાં ન હોવાથી બોર્ડે ગ્રેસ આપ્યા.`]],
  [100, `એક નિયમિત બહુકોણ જેના પ્રત્યેક બહિષ્કોણનું માપ 60° હોય તેને ..... કહે છે.`, [`નિયમિત અષ્ટકોણ`,`ચતુષ્કોણ`,`નિયમિત ષટ્કોણ`,`ત્રિકોણ`], `C`, [`બાજુઓ = 360° ÷ 60° = 6, એટલે નિયમિત ષટ્કોણ.`]],
  [101, `ઉર્દૂ ભાષા બોલતા વિદ્યાર્થીઓની ટકાવારી? (ગુજરાતી 40, અંગ્રેજી 12, ઉર્દૂ 9, હિન્દી 7, સિંધી 4)`, [`25%`,`36%`,`10%`,`12.5%`], `D`, [`કુલ = 40+12+9+7+4 = 72. ઉર્દૂ = (9 ÷ 72) × 100 = 12.5%.`]],
  [102, `6, 9 અને 15 વડે નિઃશેષ ભાગી શકાય તેવી નાનામાં નાની પૂર્ણવર્ગ સંખ્યા?`, [`810`,`900`,`90`,`400`], `B`, [`લ.સા.અ. = 90 (2×3²×5). પૂર્ણવર્ગ માટે 2²×3²×5² = 900.`]],
  [103, `તનુજાએ એક હારમાં 4 છોડ રોપ્યા. બે છોડ વચ્ચે ¾ મીટર અંતર છે. પ્રથમ અને છેલ્લા છોડ વચ્ચે અંતર?`, [`2¾ મી`,`3²⁄₄ મી`,`2¼ મી`,`9/4 મી`], `CD`, [`4 છોડ વચ્ચે 3 ગાળા = 3 × ¾ = 9/4 મી = 2¼ મી. C અને D બંને માન્ય.`]],
  [104, `આકૃતિ પરથી અંતઃકોણની જોડ ઓળખો.`, [`∠1 અને ∠2, ∠7 અને ∠8`,`∠1 અને ∠5, ∠2 અને ∠6`,`∠3 અને ∠5, ∠4 અને ∠6`,`∠3 અને ∠6, ∠4 અને ∠5`], `C`, [`સમાંતર રેખાઓ વચ્ચે છેદિકાની એક જ બાજુના ખૂણા: ∠3 અને ∠5, ∠4 અને ∠6.`]],
  [105, `સંમેય સંખ્યાની કઈ જોડી સમાન નથી?`, [`−4/−5 = 4/5`,`−5/8 = 15/−24`,`1/−3 = 3/−9`,`−7/21 = 3/9`], `D`, [`−7/21 = −1/3, જ્યારે 3/9 = +1/3. ચિહ્ન અલગ હોવાથી સમાન નથી.`]],
  [106, `x = −2 માટે 4(2x − 1) + 3x + 11 ની કિંમત?`, [`−4`,`−25`,`25`,`29`], `G`, [`4(−5) + (−6) + 11 = −15, જે વિકલ્પોમાં નથી → ગ્રેસ (બધાને ગુણ).`]],
  [107, `કઈ આકૃતિમાં અસંખ્ય સમમિતિ રેખાઓ દર્શાવી શકાય?`, [`નિયમિત ષટ્કોણ`,`લંબચોરસ`,`ચતુષ્કોણ`,`વર્તુળ`], `D`, [`વર્તુળના દરેક વ્યાસ પર સમમિતિ રેખા મળે અને વ્યાસ અસંખ્ય હોય.`]],
  [108, `નિયમિત બહુકોણના દરેક બહિષ્કોણનું માપ 20° હોય તો તેને કેટલી બાજુઓ હોય?`, [`16`,`18`,`20`,`24`], `B`, [`બાજુઓ = 360° ÷ 20° = 18.`]],
  [109, `શાળામાં 640 વિદ્યાર્થી છે. હાર અને સ્તંભોની સંખ્યા સમાન રહે તેમ ઊભા રાખતાં કેટલાને બહાર રાખવા પડે?`, [`5`,`10`,`15`,`20`], `C`, [`640 થી નાનો સૌથી નજીકનો પૂર્ણવર્ગ 25² = 625. બહાર રહેશે = 640 − 625 = 15.`]],
  [110, `મનિષે પગારમાંથી 75% વાપર્યા પછી રૂ. 3000 બાકી રહ્યા. તેનો પગાર?`, [`9000`,`10000`,`11000`,`12000`], `D`, [`બાકી 25% = 3000 → 100% = 3000 × 4 = રૂ. 12000.`]],
  [111, `લંબઘનની લંબાઈ mn, પહોળાઈ mp², ઊંચાઈ m²n²p. ઘનફળ?`, [`m³n³p³`,`m³n⁴p³`,`m⁴n³p³`,`m²n³p⁴`], `C`, [`(mn)(mp²)(m²n²p) = m¹⁺¹⁺² n¹⁺² p²⁺¹ = m⁴n³p³.`]],
  [112, `સમબાજુ ચતુષ્કોણના વિકર્ણોની લંબાઈ 8.5 સેમી અને 16 સેમી છે. ક્ષેત્રફળ?`, [`64`,`64.5`,`68.5`,`68`], `D`, [`ક્ષેત્રફળ = ½ × 8.5 × 16 = 8.5 × 8 = 68 ચો.સેમી.`]],
  [113, `વનસ્પતિકોષનું માપ 0.00001275 મી. છે. પ્રમાણિત સ્વરૂપે?`, [`1275 × 10⁻⁵`,`1.275 × 10⁻⁵`,`127.5 × 10⁻⁵`,`12.75 × 10⁻⁵`], `B`, [`દશાંશ ચિહ્ન જમણે 5 સ્થાન ખસેડતાં 1.275 × 10⁻⁵ મી.`]],
  [114, `એક યંત્ર 6 કલાકમાં 840 બોટલ ભરે છે. 5 કલાકમાં કેટલી ભરશે?`, [`740`,`730`,`710`,`700`], `D`, [`1 કલાકમાં = 840 ÷ 6 = 140 → 5 કલાકમાં = 140 × 5 = 700.`]],
  [115, `સંમેય સંખ્યાઓ માટે કયું વિધાન ખોટું છે?`, [`સરવાળા-ગુણાકાર માટે ક્રમતા ગુણધર્મ પળાય છે`,`સરવાળા-ગુણાકાર માટે જૂથના ગુણધર્મ પળાય છે`,`સરવાળા અને ગુણાકાર માટે 1 સંખ્યા તટસ્થ છે`,`a(a+b)=ab+ac એ વિભાજનનો ગુણધર્મ છે`], `CD`, [`(C) ખોટું: સરવાળા માટે તટસ્થ 0 છે. (D) માં છાપભૂલ (a(b+c) હોવું જોઈએ). બંને માન્ય.`]],
  [116, `ગાડી 1 લિટર પેટ્રોલમાં 16 કિમી કાપે છે. 2¾ લિટરમાં કેટલું અંતર?`, [`44 કિમી`,`23 કિમી`,`48 કિમી`,`24 કિમી`], `A`, [`2¾ = 11/4. અંતર = 16 × 11/4 = 44 કિમી.`]],
  [117, `13, 16, 12, 14, 19, 12, 14, 13, 14 નો મધ્યસ્થ?`, [`14`,`13`,`19`,`12`], `A`, [`ચડતો ક્રમ: 12, 12, 13, 13, 14, 14, 14, 16, 19. વચ્ચેની 5 મી સંખ્યા = 14.`]],
  [118, `થેલામાં 4 લાલ અને 2 પીળા દડા છે. આંખો બંધ કરી એક દડો કાઢતાં તે લીલો હોવાની સંભાવના?`, [`6/6`,`4/6`,`2/6`,`0`], `D`, [`થેલામાં લીલો દડો છે જ નહીં, એટલે અશક્ય ઘટનાની સંભાવના = 0.`]],
  [119, `18 છોકરીઓ અને 12 છોકરાઓની સંખ્યાનો ગુણોત્તર?`, [`8:2`,`5:4`,`2:3`,`3:2`], `D`, [`18 : 12 ને 6 વડે ભાગતાં 3 : 2.`]],
  [120, `સમાંતર રેખાઓની છેદિકાથી રચાતા ખૂણા માટે કયું વિધાન ખોટું છે?`, [`અનુકોણ સમાન હોય છે`,`અંતઃયુગ્મકોણ કોટિકોણ હોય છે`,`એક બાજુના અંતઃકોણ પૂરક હોય છે`,`અંતઃયુગ્મકોણ સમાન હોય છે`], `B`, [`અંતઃયુગ્મકોણ સમાન હોય છે, કોટિકોણ (90°) નહીં.`]],
  [121, `ચાર સરખા પાત્રોમાં સમાન પાણી ભરી સૂર્યપ્રકાશમાં મૂકતાં કયા રંગની સપાટીવાળા પાત્રનું પાણી ઝડપથી ગરમ થશે?`, [`ગુલાબી`,`લીલો`,`કાળો`,`પીળો`], `C`, [`કાળો રંગ ઉષ્માનું સૌથી વધુ શોષણ કરે છે.`]],
  [122, `સમતલ અરીસા માટે કયું સાચું નથી?`, [`સીધું પ્રતિબિંબ મળે`,`આભાસી પ્રતિબિંબ મળે`,`વસ્તુ અને પ્રતિબિંબ અંતર સરખું`,`વસ્તુ કરતા નાનું પ્રતિબિંબ મળે`], `D`, [`સમતલ અરીસામાં હંમેશા વસ્તુના જેટલા જ કદનું પ્રતિબિંબ મળે.`]],
  [123, `જો જમીન બેઝિક હોય તો તેમાં શું ઉમેરવું જોઈએ?`, [`કાર્બનિક દ્રવ્ય`,`ક્વિક લાઇમ`,`સ્લેક્ડ લાઇમ`,`કેલેમાઇન દ્રાવણ`], `A`, [`ખાતર જેવું કાર્બનિક દ્રવ્ય ઉમેરવાથી જમીનની બેઝિક પ્રકૃતિ ઘટે છે.`]],
  [124, `ખરીફ પાક કયો છે?`, [`ચણા`,`વટાણા`,`ડાંગર`,`રાઈ`], `C`, [`ડાંગર ચોમાસામાં વવાતો ખરીફ પાક છે; બાકીના ત્રણ રવી પાક છે.`]],
  [125, `કલ્ટિવેટરનો ઉપયોગ શેના માટે થાય છે?`, [`વાવણી કરવા`,`ખેડ કરવા`,`ખાતર છાંટવા`,`લણણી કરવા`], `B`, [`કલ્ટિવેટર ટ્રેક્ટરથી જમીન ખેડવા અને પોચી કરવા વપરાય છે.`]],
  [126, `વાઇરસ દ્વારા થતો રોગ કયો છે?`, [`કોલેરા`,`ટાઇફોઇડ`,`ક્ષય`,`પોલિયો`], `D`, [`પોલિયો વાઇરસથી થાય છે; કોલેરા, ટાઇફોઇડ, ક્ષય બેક્ટેરિયાથી થાય.`]],
  [127, `લેક્ટોબેસિલસ બેક્ટેરિયાનું મુખ્ય કાર્ય શું છે?`, [`દૂધમાંથી દહીં બનાવવાનું`,`જમીનની ફળદ્રુપતા વધારવાનું`,`કચરાનું વિઘટન કરવાનું`,`આથવણ લાવવાનું`], `A`, [`લેક્ટોબેસિલસ દૂધને દહીંમાં ફેરવે છે.`]],
  [128, `'પેટ્રોલિયમ' શબ્દમાં 'પેટ્રો' નો અર્થ શું થાય છે?`, [`પેટ્રોલ`,`જમીન`,`તેલ`,`ખડક`], `D`, [`પેટ્રો (ખડક) + ઓલિયમ (તેલ) = ખડકમાંથી મળતું તેલ.`]],
  [129, `નીચેના વિકલ્પો પૈકી કોનું જ્વલનબિંદુ સૌથી ઊંચું હોય?`, [`પેટ્રોલ`,`CNG`,`લાકડું`,`કેરોસીન`], `A`, [`સત્તાવાર કી મુજબ જવાબ (A) પેટ્રોલ આપ્યો છે (પ્રશ્નમાં "નીચું" અપેક્ષિત હતું).`]],
  [130, `પંચમઢી જીવાવરણ આરક્ષિત ક્ષેત્રમાં જોવા મળતું 'બાયસન' શું છે?`, [`જંગલી આંબો`,`વિશાળ ખિસકોલી`,`ઉડતી ખિસકોલી`,`જંગલી બળદ`], `D`, [`બાયસન (ભારતીય ગૌર) એ જંગલી બળદ છે.`]],
  [131, `છોકરાઓમાં મોટા થયેલી સ્વરપેટી ગળાના ભાગમાં બહારની તરફ ઉપસી આવે છે, તેને શું કહે છે?`, [`કંઠસ્થાન`,`કંઠમણિ`,`સ્વરસ્થાન`,`સ્વરમણિ`], `B`, [`ગળાના ઉપસેલા ભાગને કંઠમણિ (Adam's apple) કહે છે.`]],
  [132, `મગજ સાથે જોડાયેલી ગ્રંથિ કઈ છે?`, [`થાઇરોઇડ`,`સ્વાદુપિંડ`,`પિટ્યુટરી`,`એડ્રિનલ`], `C`, [`પિટ્યુટરી (પીયૂષ) ગ્રંથિ મગજના તળિયે જોડાયેલી મુખ્ય ગ્રંથિ છે.`]],
  [133, `આપણાં શરીરમાં રુધિરના નિર્માણનું કામ કોણ કરે છે?`, [`આયર્ન`,`ચરબી`,`કાર્બોદિત`,`વિટામીન`], `A`, [`લોહતત્ત્વ (આયર્ન) હિમોગ્લોબિન અને રુધિર નિર્માણમાં મદદ કરે છે.`]],
  [134, `નીચેનામાંથી કયું જોડકું યોગ્ય નથી?`, [`ફોર્મિક એસિડ – કીડી`,`એસેટિક એસિડ – વિનેગર`,`લેક્ટિક એસિડ – દહીં`,`ઓક્ઝેલિક એસિડ – નારંગી`], `D`, [`નારંગીમાં સાઇટ્રિક એસિડ હોય છે; ઓક્ઝેલિક એસિડ પાલકમાં હોય.`]],
  [135, `વિનેગાર અને બેકિંગ સોડાને મિશ્ર કરતાં ......... વાયુ ઉત્પન્ન થાય છે?`, [`કાર્બન ડાયોક્સાઇડ`,`નાઇટ્રોજન`,`ઓક્સિજન`,`હાઇડ્રોજન`], `A`, [`એસિડ + બેકિંગ સોડા → CO₂ (કાર્બન ડાયોક્સાઇડ) વાયુ ફીણ સ્વરૂપે નીકળે.`]],
  [136, `ભારે કસરત કરવાથી સ્નાયુઓમાં ......... એકઠું થવાના કારણે સ્નાયુઓ ખેંચાઈ જાય છે?`, [`કાર્બન ડાયોક્સાઇડ`,`આલ્કોહોલ`,`લેક્ટિક એસિડ`,`ઓક્સિજન`], `C`, [`અનોક્સિશ્વસનથી સ્નાયુઓમાં લેક્ટિક એસિડ બનવાથી સ્નાયુ ખેંચાય.`]],
  [137, `પદાર્થે કાપેલ અંતર શોધવાનું સૂત્ર: કાપેલું અંતર = ?`, [`અંતર × સમય`,`સમય/ઝડપ`,`ઝડપ/સમય`,`ઝડપ × સમય`], `D`, [`ઝડપ = અંતર ÷ સમય → અંતર = ઝડપ × સમય.`]],
  [138, `સાબુના પરપોટા વડે પ્રકાશનું ઘણા રંગોમાં છુટા પડવાની ઘટનાને ......... કહે છે?`, [`પ્રકાશનું વિભાજન`,`પ્રકાશનું શોષણ`,`પ્રકાશનું પ્રસરણ`,`પ્રકાશનું પરાવર્તન`], `A`, [`શ્વેત પ્રકાશનું રંગોમાં વહેંચાવું એ પ્રકાશનું વિભાજન છે.`]],
  [139, `કાપવામાં આવેલ પાકમાંથી દાણાઓને ભૂસામાંથી અલગ કરવાની પ્રક્રિયાને શું કહે છે?`, [`વિડિંગ`,`હાર્વેસ્ટિંગ`,`થ્રેશીંગ`,`ઈરિગેશન`], `C`, [`દાણા અને ભૂસું છૂટા પાડવાની ક્રિયા થ્રેશીંગ છે.`]],
  [140, `સુરક્ષિત દીવાસળી બનાવવા માટે શાનો ઉપયોગ થાય છે?`, [`લાલ અને સફેદ ફોસ્ફરસ`,`એન્ટિમની ટ્રાય સલ્ફાઇડ અને પોટેસિયમ ક્લોરેટ`,`સફેદ ફોસ્ફરસ અને પોટેશિયમ ક્લોરેટ`,`એન્ટિમની ટ્રાય સલ્ફાઇડ અને સફેદ ફોસ્ફરસ`], `B`, [`દીવાસળીના માથા પર એન્ટિમની ટ્રાય સલ્ફાઇડ અને પોટેસિયમ ક્લોરેટ વપરાય.`]],
  [141, `નીચેનામાંથી કયું જોડકું યોગ્ય નથી?`, [`રેડ-ડેટા બુક → લુપ્ત જાતિઓની યાદી`,`પ્રોજેક્ટ ટાઇગર → વાઘ સંરક્ષણ`,`પુનઃવનીકરણ → જંગલોની પુનઃસ્થાપના`,`રણનિર્માણ → ભૂમિનું રણમાં ફેરવાવું`], `A`, [`રેડ ડેટા બુકમાં ભયગ્રસ્ત (નાશપ્રાય) જાતિઓની નોંધ હોય છે.`]],
  [142, `કાર્બનનું લગભગ સંપૂર્ણ શુદ્ધ સ્વરૂપ કયું છે?`, [`ડીઝલ`,`કોલટાર`,`કોલગેસ`,`કોક`], `D`, [`કોક એ કોલસામાંથી મળતું લગભગ શુદ્ધ કાર્બન સ્વરૂપ છે.`]],
  [143, `કઈ ગ્રંથિ યોગ્ય કામ ન કરે તો ડાયાબિટિસ થાય?`, [`પિટ્યુટરી`,`થાઇરોઇડ`,`સ્વાદુપિંડ`,`એડ્રિનલ`], `C`, [`સ્વાદુપિંડ ઇન્સ્યુલિન બનાવે છે; તેની ખામીથી ડાયાબિટિસ થાય.`]],
  [144, `વનસ્પતિમાં ખોરાક બનાવવાના કારખાનાં કોને કહેવાય છે?`, [`પર્ણ`,`પ્રકાંડ`,`ફળ`,`મૂળ`], `A`, [`પર્ણમાં હરિતદ્રવ્યથી પ્રકાશસંશ્લેષણ દ્વારા ખોરાક બને છે.`]],
  [145, `હાઇડ્રોક્લોરિક એસિડ અને સોડિયમ હાઇડ્રોક્સાઇડ વચ્ચેની તટસ્થીકરણની પ્રક્રિયાથી શું બને છે?`, [`હવા અને પાણી`,`ક્ષાર અને પાણી`,`ધાતુ અને મીણ`,`તેલ અને તાંબુ`], `B`, [`HCl + NaOH → NaCl (ક્ષાર) + H₂O (પાણી).`]],
  [146, `સ્ટાર્ચનું સરળ શર્કરામાં રૂપાંતરણ કરવાનું કાર્ય કોણ કરે છે?`, [`અન્નનળી`,`રસાંકુરો`,`મુખગુહા`,`લાળરસ`], `D`, [`લાળરસમાંનું ઉત્સેચક સ્ટાર્ચને સરળ શર્કરામાં ફેરવે છે.`]],
  [147, `બાજની મહત્તમ ઝડપ 320 km/h હોય તો તેની ઝડપ m/sec માં કેટલી?`, [`8.89`,`320`,`889`,`88.9`], `D`, [`320 × 5/18 = 1600/18 = 88.89 ≈ 88.9 m/sec.`]],
  [148, `કુદરતી વાયુમાંથી મેળવવામાં આવતા ......... વાયુનો ઉપયોગ કૃત્રિમ ખાતરની બનાવટમાં થાય છે.`, [`કોલગેસ`,`CNG`,`હાઇડ્રોજન`,`કાર્બન ડાયોક્સાઇડ`], `C`, [`હાઇડ્રોજન વાયુ યુરિયા જેવા કૃત્રિમ ખાતર બનાવવા વપરાય છે.`]],
  [149, `શાના દ્વારા હંમેશા ચત્તુ, આભાસી અને વસ્તુના પરિમાણ કરતા નાનું પ્રતિબિંબ મળે?`, [`બહિર્ગોળ અરીસો, અંતર્ગોળ લેન્સ`,`અંતર્ગોળ અરીસો, બહિર્ગોળ લેન્સ`,`બહિર્ગોળ લેન્સ, સમતલ અરીસો`,`અંતર્ગોળ લેન્સ, અંતર્ગોળ અરીસો`], `A`, [`બહિર્ગોળ અરીસો અને અંતર્ગોળ લેન્સ હંમેશા ચત્તું, આભાસી અને નાનું પ્રતિબિંબ આપે.`]],
  [150, `એક સ્થાનેથી બીજા સ્થાન કે આગળ-પાછળ થતી પદાર્થની ગતિને શું કહે છે?`, [`કંપન`,`કંપવિસ્તાર`,`આવૃત્તિ`,`ઘોંઘાટ`], `A`, [`મધ્યસ્થાન ફરતે આગળ-પાછળ થતી ગતિ એ કંપન છે.`]],
  [151, `અંગ્રેજ શાસન દરમિયાન કયા ધારા અંતર્ગત ભારતમાં સુપ્રીમ કોર્ટની સ્થાપના કરવામાં આવેલ?`, [`સનદી ધારો (1833)`,`નિયામક ધારો (1773)`,`A અને B બંને`,`એક પણ નહિ`], `B`, [`1773 ના નિયામક (રેગ્યુલેટિંગ) ધારા હેઠળ કલકત્તામાં સુપ્રીમ કોર્ટ સ્થપાઈ.`]],
  [152, `જમીન મહેસૂલ માટે અંગ્રેજોએ બનાવેલી યોજનાઓમાં કઈ યોજના જમીન મહેસૂલ નથી?`, [`સહાયકારી યોજના`,`કાયમી જમાબંધી`,`રૈયતવારી પદ્ધતિ`,`મહાલવારી પદ્ધતિ`], `A`, [`સહાયકારી યોજના રાજ્યો પર અંકુશ રાખવાની નીતિ હતી, મહેસૂલ પદ્ધતિ નહીં.`]],
  [153, `ઈ.સ. 1857 ના સંગ્રામમાં કઈ નવીન રાઇફલનો ઉપયોગ કરવામાં આવ્યો હતો?`, [`એનફિલ્ડ`,`એ.ડબલ્યુ.એમ.`,`બ્રાઉનબેઝ`,`રોનાલ્ડ`], `A`, [`નવી એનફિલ્ડ રાઇફલના ચરબીવાળા કારતૂસ 1857 ના સંગ્રામનું તાત્કાલિક કારણ બન્યા.`]],
  [154, `જૂની દિલ્લીથી કઈ દિશામાં નવી દિલ્લીનું નિર્માણ કઈ પહાડી ઉપર કરવામાં આવેલ છે?`, [`ઉત્તરમાં રાજસમંદ`,`દક્ષિણમાં અજયમેરુ`,`ઉત્તરમાં અરવલ્લી`,`દક્ષિણમાં રાયસીન પહાડી વિસ્તારમાં`], `D`, [`નવી દિલ્લી જૂની દિલ્લીની દક્ષિણે રાયસીના (રાયસીન) પહાડી પર બની.`]],
  [155, `ક્રાયોલાઇટ ખનિજ કયા સંસાધન તરીકે ઓળખાય છે?`, [`દુર્લભ સંસાધન`,`વિરલ સંસાધન`,`સામાન્ય સુલભ સંસાધન`,`સર્વ સુલભ સંસાધન`], `A`, [`ક્રાયોલાઇટ બહુ ઓછી જગ્યાએ મળે છે, એટલે કી મુજબ દુર્લભ સંસાધન.`]],
  [156, `ખનિજ પદાર્થોમાં કોને 'કાળું સોનું' કહેવામાં આવે છે?`, [`મેંગેનીઝ`,`સોનું`,`ખનિજતેલ`,`બૉક્સાઇટ`], `C`, [`ખનિજતેલ (પેટ્રોલિયમ) કીમતી હોવાથી 'કાળું સોનું' કહેવાય છે.`]],
  [157, `ભારતનું કયું રાજ્ય કપાસના ઉત્પાદનમાં પ્રથમ છે?`, [`ગુજરાત`,`મહારાષ્ટ્ર`,`આંધ્રપ્રદેશ`,`બિહાર`], `A`, [`કી મુજબ કપાસના ઉત્પાદનમાં ગુજરાત પ્રથમ છે.`]],
  [158, `બાળમજૂરીનો વિરોધ કરવા કયો હક આપવામાં આવેલ છે?`, [`સ્વતંત્રતાનો હક`,`શોષણ સામે વિરોધનો હક`,`ધાર્મિક સ્વાતંત્ર્યનો હક`,`સમાનતાનો હક`], `B`, [`શોષણ સામે વિરોધનો હક બાળમજૂરી અને વેઠ પર પ્રતિબંધ મૂકે છે.`]],
  [159, `દ્વારકેશને ફોર્ટ સેન્ટ જ્યોર્જની મુલાકાત લેવી છે. તેણે કયા શહેરમાં જવું પડશે?`, [`કોલકત્તા`,`મુંબઈ`,`ચેન્નાઈ`,`દિલ્લી`], `C`, [`ફોર્ટ સેન્ટ જ્યોર્જ ચેન્નાઈ (મદ્રાસ) માં આવેલો કિલ્લો છે.`]],
  [160, `નીચે પૈકી કઈ જમીન મહેસૂલ પદ્ધતિ નથી?`, [`કાયમી જમાબંધી`,`ઉલગુલાન`,`મહાલવારી`,`રૈયતવારી`], `B`, [`ઉલગુલાન બિરસા મુંડાનું આદિવાસી આંદોલન હતું.`]],
  [161, `અધાતુમય ખનિજનાં ઉદાહરણો કયા છે? (1) જસત (2) અબરખ (3) જિપ્સમ (4) તાંબુ`, [`1 અને 2`,`3 અને 4`,`2 અને 4`,`2 અને 3`], `D`, [`અબરખ અને જિપ્સમ અધાતુમય છે; જસત અને તાંબુ ધાતુમય છે.`]],
  [162, `મગફળીની : જૂનાગઢ :: બાજરી : ?`, [`મહેસાણા`,`સાબરકાંઠા`,`બનાસકાંઠા`,`ભાવનગર`], `C`, [`જૂનાગઢ મગફળી માટે અને બનાસકાંઠા બાજરી માટે જાણીતું છે.`]],
  [163, `બંધારણ સંદર્ભે નીચે પૈકી કઈ જોડ યોગ્ય નથી?`, [`સમિતિઓ : 23`,`અધ્યક્ષ : ડૉ. રાજેન્દ્ર પ્રસાદ`,`બંધારણ દિવસ : 26 નવેમ્બર`,`કુલ સભ્યો : 250`], `D`, [`બંધારણ સભાના મૂળ સભ્યો 389 (વિભાજન પછી 299) હતા, 250 નહીં.`]],
  [164, `નીચે પૈકી કયું વિધાન રાષ્ટ્રપતિ સાથે સુસંગત નથી?`, [`બંધારણીય વડા છે`,`મંત્રીમંડળની બેઠકની અધ્યક્ષતા કરે છે`,`પ્રથમ નાગરિક છે`,`વહીવટ તેમના નામે ચાલે છે`], `B`, [`મંત્રીમંડળની બેઠકની અધ્યક્ષતા વડાપ્રધાન કરે છે, રાષ્ટ્રપતિ નહીં.`]],
  [165, `પોર્ટુગીઝોએ ભારતનો કયો ટાપુ બ્રિટનના સમ્રાટને દહેજમાં આપ્યો હતો?`, [`મુંબઈ`,`લક્ષદ્વીપ`,`અંદમાન`,`નિકોબાર`], `A`, [`1661 માં બ્રિટનના રાજા ચાર્લ્સ બીજાને પોર્ટુગીઝોએ મુંબઈ દહેજમાં આપ્યું.`]],
  [166, `વિરલ સંસાધન કયું છે?`, [`ગોચર ભૂમિ`,`ઓક્સિજન`,`પાણી`,`કોલસો`], `D`, [`કોલસો મર્યાદિત જગ્યાએ અને જથ્થામાં મળતું વિરલ સંસાધન છે.`]],
  [167, `પૃથ્વી પર મીઠા પાણીનો જથ્થો કેટલો છે?`, [`1%`,`2.7%`,`27%`,`29%`], `B`, [`કુલ પાણીમાંથી આશરે 97.3% ખારું અને માત્ર 2.7% મીઠું પાણી છે.`]],
  [168, `'અયસ્ક' એટલે શું?`, [`અશુદ્ધ ખનિજો`,`વિદ્યુત`,`રહેવા માટે મકાન`,`હવા`], `A`, [`ધાતુ મેળવવા માટેનું અશુદ્ધિવાળું કાચું ખનિજ અયસ્ક કહેવાય.`]],
  [169, `જૈવ કચરામાંથી તૈયાર થતા વાયુયુક્ત બળતણને શું કહે છે?`, [`LPG`,`CNG`,`PNG`,`બાયોગેસ`], `D`, [`છાણ અને ખેતીના કચરામાંથી બનતો ગેસ બાયોગેસ છે.`]],
  [170, `......... ભારત દેશની અર્થવ્યવસ્થાની જીવનરેખા ગણાય છે?`, [`ઉદ્યોગ`,`શિક્ષણ`,`પાણી`,`ખેતી`], `D`, [`ભારતની મોટી વસ્તી ખેતી પર નભે છે, એટલે ખેતી અર્થવ્યવસ્થાની જીવનરેખા છે.`]],
  [171, `ગુજરાતના લગભગ 50% કરતાં વધુ વિસ્તારમાં કેવી જમીન જોવા મળે છે?`, [`રાતી જમીન`,`કાળી જમીન`,`કાંપની જમીન`,`પર્વતીય જમીન`], `C`, [`કી મુજબ ગુજરાતના અડધાથી વધુ ભાગમાં કાંપની જમીન છે.`]],
  [172, `ભૂમિખંડની સપાટી ખાસ કરીને કયા ખનીજોથી બનેલી હોય છે?`, [`સિલિકા અને એલ્યુમિના`,`સિલિકા અને મેગ્નેશિયમ`,`નિકલ અને ફેરસ`,`મેગ્નેશિયમ અને ફેરસ`], `A`, [`ખંડીય પોપડો (SiAl) સિલિકા અને એલ્યુમિનાથી બનેલો છે.`]],
  [173, `ભારતમાં દર વર્ષે બંધારણ દિવસની ઉજવણી કઈ તારીખે થાય છે?`, [`26 મી નવેમ્બર`,`26 મી જાન્યુઆરી`,`25 મી ડિસેમ્બર`,`15 મી ઓગસ્ટ`], `A`, [`26 નવેમ્બર 1949 ના રોજ બંધારણ અપનાવાયું હતું.`]],
  [174, `ભારતની સંસદના નીચલા ગૃહમાં ગુજરાતને કેટલી બેઠકો ફાળવવામાં આવી છે?`, [`26`,`50`,`182`,`545`], `A`, [`લોકસભા (નીચલું ગૃહ) માં ગુજરાતની 26 બેઠકો છે (182 વિધાનસભાની છે).`]],
  [175, `ખેડૂતનું શોષણ રોકવા માટે સરકારે કેવા બજારની વ્યવસ્થા કરી છે?`, [`મહોલ્લા બજાર`,`નિયંત્રિત બજાર`,`સાપ્તાહિક બજાર`,`ઓનલાઈન બજાર`], `B`, [`નિયંત્રિત બજાર (APMC) દ્વારા ખેડૂતોને વાજબી ભાવ મળે છે.`]],
  [176, `ગઢવાલ રાજ્યના સ્થાપક ચંદ્રદેવે કનોજ સિવાય બીજા કયા શહેરને પોતાના રાજ્યની રાજધાની બનાવી હતી?`, [`ખજુરાહો`,`ભોજપાલ`,`કાશી`,`બુંદેલખંડ`], `C`, [`ચંદ્રદેવે કનોજ સાથે કાશી (વારાણસી) ને રાજધાની બનાવી હતી.`]],
  [177, `નીચે પૈકી કયા રાજ્યમાં વિધાન પરિષદ નથી?`, [`ગુજરાત`,`બિહાર`,`મહારાષ્ટ્ર`,`ઉત્તરપ્રદેશ`], `A`, [`ગુજરાતમાં માત્ર વિધાનસભા છે, વિધાન પરિષદ નથી.`]],

// Fisher-Yates Shuffle
function shuffleArray(arr) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

function getAnswerDisplay(code, opts) {
  if (code === `G`) return `ગ્રેસ (બધાને ગુણ મળશે)`;
  if (code === `AD`) return `(A) ${opts[0]} અને (D) ${opts[3]} — બંને માન્ય`;
  if (code === `CD`) return `(C) ${opts[2]} અને (D) ${opts[3]} — બંને માન્ય`;
  const idx = `ABCD`.indexOf(code);
  if (idx >= 0) return `(${code}) ${opts[idx]}`;
  return code;
}

function isOptionCorrect(optIdx, code) {
  const ch = `ABCD`[optIdx];
  if (code === `G`) return true;
  return code.indexOf(ch) !== -1;
}

// Persistence helpers
async function saveProgress() {
  if (window.notebookAppApi && typeof window.notebookAppApi.setAppState === `function`) {
    try {
      await window.notebookAppApi.setAppState({
        perPage: appState.perPage,
        currentPage: appState.currentPage,
        points: appState.points,
        streak: appState.streak,
        bestStreak: appState.bestStreak
      });
    } catch (e) {}
  }
}

// Navigation Tab Switcher
function switchTab(tab) {
  appState.activeTab = tab;
  const studyView = document.getElementById(`study-view`);
  const gamesView = document.getElementById(`games-view`);
  const studyBtn = document.getElementById(`tab-study-btn`);
  const gamesBtn = document.getElementById(`tab-games-btn`);
  if (!studyView || !gamesView || !studyBtn || !gamesBtn) return;

  if (tab === `study`) {
    stopSpeedTimer();
    studyView.classList.remove(`hidden`);
    gamesView.classList.add(`hidden`);
    studyBtn.classList.add(`active`);
    gamesBtn.classList.remove(`active`);
  } else {
    studyView.classList.add(`hidden`);
    gamesView.classList.remove(`hidden`);
    studyBtn.classList.remove(`active`);
    gamesBtn.classList.add(`active`);
    updateGamesHud();
    startGame(appState.activeGame);
  }
}

// STUDY TAB LOGIC
function changePerPage(val) {
  appState.perPage = val === `all` ? `all` : parseInt(val, 10);
  appState.currentPage = 1;
  renderStudy();
  saveProgress();
}

function handleSearchJump(val) {
  appState.searchQuery = val.trim();
  appState.currentPage = 1;
  renderStudy();
}

function clearSearchJump() {
  const inp = document.getElementById(`search-jump-input`);
  if (inp) inp.value = ``;
  appState.searchQuery = ``;
  appState.currentPage = 1;
  renderStudy();
}

function getFilteredQuestions() {
  const q = appState.searchQuery;
  if (!q) return Q_DATA;
  if (/^\d+$/.test(q)) {
    const num = parseInt(q, 10);
    if (num >= 1 && num <= 180) {
      return Q_DATA.filter(item => item[0] === num);
    }
  }
  const low = q.toLowerCase();
  return Q_DATA.filter(item =>
    String(item[0]).includes(low) ||
    item[1].toLowerCase().includes(low) ||
    item[2].some(o => o.toLowerCase().includes(low)) ||
    item[4].some(s => s.toLowerCase().includes(low))
  );
}

function toggleExplanation(qid) {
  appState.revealedIds[qid] = !appState.revealedIds[qid];
  renderStudy();
}

function goToPage(page) {
  appState.currentPage = page;
  renderStudy();
  saveProgress();
  window.scrollTo({ top: 0, behavior: `smooth` });
}

function renderStudy() {
  const container = document.getElementById(`questions-container`);
  const statusEl = document.getElementById(`study-status`);
  const pageBar = document.getElementById(`pagination-bar`);
  if (!container || !statusEl || !pageBar) return;

  const list = getFilteredQuestions();
  const total = list.length;
  const perPage = appState.perPage === `all` ? (total || 1) : appState.perPage;
  const totalPages = Math.max(1, Math.ceil(total / perPage));
  if (appState.currentPage > totalPages) appState.currentPage = totalPages;

  const start = (appState.currentPage - 1) * perPage;
  const end = Math.min(total, start + perPage);
  const pageItems = list.slice(start, end);

  if (total === 0) {
    statusEl.textContent = `કોઈ પ્રશ્ન મળ્યો નથી.`;
    container.innerHTML = `<div class="q-card"><p class="q-text">તમારી શોધ મુજબ કોઈ પ્રશ્ન મળ્યો નથી. 1 થી 180 વચ્ચેનો નંબર અથવા અન્ય શબ્દ લખો.</p></div>`;
    pageBar.innerHTML = ``;
    return;
  }

  statusEl.textContent = `કુલ ${total} પ્રશ્નોમાંથી ${start + 1} થી ${end} બતાવે છે (પેજ ${appState.currentPage} / ${totalPages})`;

  let html = ``;
  for (let i = 0; i < pageItems.length; i++) {
    const q = pageItems[i];
    const id = q[0];
    const text = q[1];
    const opts = q[2];
    const ans = q[3];
    const steps = q[4];
    const isOpen = !!appState.revealedIds[id];

    let optsHtml = ``;
    const letters = [`A`, `B`, `C`, `D`];
    for (let j = 0; j < opts.length; j++) {
      const correctClass = isOpen && isOptionCorrect(j, ans) ? ` is-correct-reveal` : ``;
      optsHtml += `<div class="opt-chip${correctClass}"><span class="opt-letter">${letters[j]}</span><span>${opts[j]}</span></div>`;
    }

    let explainHtml = ``;
    if (isOpen) {
      let stepsLi = ``;
      for (let s = 0; s < steps.length; s++) {
        stepsLi += `<li>${steps[s]}</li>`;
      }
      explainHtml = `
        <div class="explain-box">
          <div class="ans-banner">
            <span>✔ સાચો જવાબ: ${getAnswerDisplay(ans, opts)}</span>
          </div>
          <ol class="steps-list">${stepsLi}</ol>
        </div>
      `;
    }

    html += `
      <article class="q-card">
        <div class="q-head">
          <span class="q-num-pill">પ્રશ્ન ${id}</span>
        </div>
        <p class="q-text">${text}</p>
        <div class="options-grid">${optsHtml}</div>
        <button type="button" class="btn btn-primary" onclick="toggleExplanation(${id})">
          <span>${isOpen ? `સમજૂતી છુપાવો` : `સમજૂતી જુઓ`}</span>
        </button>
        ${explainHtml}
      </article>
    `;
  }
  container.innerHTML = html;

  // Pagination controls
  if (totalPages <= 1) {
    pageBar.innerHTML = `<span style="font-weight:700; color:var(--on-surface-variant);">બધા ${total} પ્રશ્નો એક જ પેજ પર</span>`;
    return;
  }

  let numsHtml = ``;
  const maxBtns = 7;
  let pStart = Math.max(1, appState.currentPage - 3);
  let pEnd = Math.min(totalPages, pStart + maxBtns - 1);
  if (pEnd - pStart < maxBtns - 1) pStart = Math.max(1, pEnd - maxBtns + 1);

  if (pStart > 1) {
    numsHtml += `<button type="button" class="page-num-btn" onclick="goToPage(1)">1</button>`;
    if (pStart > 2) numsHtml += `<span>…</span>`;
  }
  for (let p = pStart; p <= pEnd; p++) {
    numsHtml += `<button type="button" class="page-num-btn ${p === appState.currentPage ? `active` : ``}" onclick="goToPage(${p})">${p}</button>`;
  }
  if (pEnd < totalPages) {
    if (pEnd < totalPages - 1) numsHtml += `<span>…</span>`;
    numsHtml += `<button type="button" class="page-num-btn" onclick="goToPage(${totalPages})">${totalPages}</button>`;
  }

  pageBar.innerHTML = `
    <button type="button" class="btn btn-soft" onclick="goToPage(${appState.currentPage - 1})" ${appState.currentPage === 1 ? `disabled` : ``}>◀ અગાઉનું</button>
    <div class="page-nums">${numsHtml}</div>
    <button type="button" class="btn btn-soft" onclick="goToPage(${appState.currentPage + 1})" ${appState.currentPage === totalPages ? `disabled` : ``}>આગળનું ▶</button>
  `;
}

function getBadgeLabel(pts) {
  if (pts >= 200) return `NMMS ચેમ્પિયન 🏆`;
  if (pts >= 100) return `સુપર સ્ટાર ⭐`;
  if (pts >= 50) return `સ્માર્ટ શીખનાર 🚀`;
  return `શરૂઆત 🌟`;
}

  const bEl = document.getElementById(`hud-best-streak`);
  const bgEl = document.getElementById(`hud-badges`);
  if (pEl) pEl.textContent = String(appState.points);
  if (sEl) sEl.textContent = `${appState.streak} 🔥`;
  if (bEl) bEl.textContent = String(appState.bestStreak);
  if (bgEl) bgEl.textContent = getBadgeLabel(appState.points);
}

function recordGameResult(isRight, bonusPts) {
  if (isRight) {
    appState.streak += 1;
    if (appState.streak > appState.bestStreak) appState.bestStreak = appState.streak;
    appState.points += (10 + (bonusPts || 0));
  } else {
    appState.streak = 0;
  }
  updateGamesHud();
  saveProgress();
}

function selectGame(gameKey) {
  appState.activeGame = gameKey;
  const keys = [`speed`, `balloon`, `race`, `solver`, `shapes`];
  for (let i = 0; i < keys.length; i++) {
    const tile = document.getElementById(`tile-${keys[i]}`);
    if (tile) {
      if (keys[i] === gameKey) tile.classList.add(`active-game`);
      else tile.classList.remove(`active-game`);
    }
  }
  startGame(gameKey);
}

function stopSpeedTimer() {
  if (gameSession.timerId) {
    clearInterval(gameSession.timerId);
    gameSession.timerId = null;
  }
}

function startGame(gameKey) {
  stopSpeedTimer();
  // Always use Fisher-Yates shuffle on game start / reload so sequence never repeats
  if (gameKey === `solver`) {
    const mathReasoningPool = Q_DATA.filter(q => q[4].length >= 2 && q[3] !== `G` && q[0] <= 120);
    gameSession.deck = shuffleArray(mathReasoningPool);
  } else if (gameKey === `shapes`) {
    gameSession.shapeDeck = shuffleArray(SHAPES_PUZZLES);
  } else {
    const cleanPool = Q_DATA.filter(q => q[3] !== `G`);
    gameSession.deck = shuffleArray(cleanPool);
  }
  gameSession.idx = 0;
  gameSession.answered = false;
  gameSession.racePos = 0;
  gameSession.solverStep = 0;
  gameSession.shapeStep = 0;
  renderActiveGame();
}

function nextGameQuestion() {
  if (appState.activeGame === `shapes`) {
    gameSession.idx = (gameSession.idx + 1) % gameSession.shapeDeck.length;
    if (gameSession.idx === 0) gameSession.shapeDeck = shuffleArray(SHAPES_PUZZLES);
    gameSession.shapeStep = 0;
  } else {
    gameSession.idx += 1;
    if (gameSession.idx >= gameSession.deck.length) {
      gameSession.deck = shuffleArray(gameSession.deck);
      gameSession.idx = 0;
    }
    if (appState.activeGame === `race` && gameSession.racePos >= gameSession.raceTotal) {
      gameSession.racePos = 0;
    }
  }
  gameSession.answered = false;
  gameSession.solverStep = 0;
  renderActiveGame();
}

function renderActiveGame() {
  const stage = document.getElementById(`game-stage`);
  if (!stage) return;
  const g = appState.activeGame;

  if (g === `shapes`) {
    renderShapesGame(stage);
    return;
  }

  const q = gameSession.deck[gameSession.idx];
  const letters = [`A`, `B`, `C`, `D`];
  let optsHtml = ``;
  for (let i = 0; i < 4; i++) {
    optsHtml += `
      <button type="button" class="game-opt-btn" id="gopt-${i}" onclick="answerStandardGame(${i})">
        <span class="opt-letter">${letters[i]}</span>
        <span>${q[2][i]}</span>
      </button>
    `;
  }

  if (g === `speed`) {
    gameSession.timeLeft = 15;
    stage.innerHTML = `
      <div class="game-top-bar">
        <span class="badge">⏱️ સ્પીડ ચેલેન્જ (પ્રશ્ન ${q[0]})</span>
        <span class="badge badge-warning" id="speed-timer-badge">સમય: 15 સે.</span>
        <button type="button" class="btn btn-soft" onclick="startGame('speed')">નવી શફલ</button>
      </div>
      <div class="progress-track"><div class="progress-fill" id="speed-bar" style="width:100%;"></div></div>
      <p class="q-text">${q[1]}</p>
      <div class="options-grid" style="grid-template-columns: 1fr;">${optsHtml}</div>
      <div id="game-feedback"></div>
    `;
    startSpeedTimer();
  } else if (g === `balloon`) {
    stage.innerHTML = `
      <div class="game-top-bar">
        <span class="badge badge-grape">🎈 બલૂન અને ફની ઇમોજી (પ્રશ્ન ${q[0]})</span>
        <button type="button" class="btn btn-soft" onclick="startGame('balloon')">નવી શફલ</button>
      </div>
      <div class="balloon-zone" id="balloon-zone">
        <span style="font-weight:700; color:var(--on-surface-variant);">જવાબ પસંદ કરો — સાચા જવાબ પર બલૂન ઊડશે! 🎈</span>
      </div>
      <p class="q-text">${q[1]}</p>
      <div class="options-grid" style="grid-template-columns: 1fr;">${optsHtml}</div>
      <div id="game-feedback"></div>
    `;
  } else if (g === `race`) {
    const pct = Math.min(100, Math.round((gameSession.racePos / gameSession.raceTotal) * 100));
    stage.innerHTML = `
      <div class="game-top-bar">
        <span class="badge">🏎️ રેસિંગ ચેલેન્જ (${gameSession.racePos}/${gameSession.raceTotal} પગલાં)</span>
        <button type="button" class="btn btn-soft" onclick="startGame('race')">રેસ ફરી શરૂ કરો</button>
      </div>
      <div class="race-track">
        <div style="font-weight:700; color:var(--on-surface-variant);">સાચો જવાબ આપો અને કારને ફિનિશ લાઇન સુધી પહોંચાડો!</div>
        <div class="race-lane">
          <div class="race-car" id="race-car-icon" style="left: ${Math.max(4, pct)}%;">🏎️</div>
          <div class="race-finish">🏁</div>
        </div>
      </div>
      <p class="q-text">પ્રશ્ન ${q[0]}: ${q[1]}</p>
      <div class="options-grid" style="grid-template-columns: 1fr;">${optsHtml}</div>
      <div id="game-feedback"></div>
    `;
  } else if (g === `solver`) {
    stage.innerHTML = `
      <div class="game-top-bar">
        <span class="badge badge-grape">🧠 મેથ્સ & રીઝનિંગ સોલ્વર (પ્રશ્ન ${q[0]})</span>
        <button type="button" class="btn btn-soft" onclick="startGame('solver')">નવી શફલ</button>
      </div>
      <p class="q-text">${q[1]}</p>
      <div class="options-grid" style="grid-template-columns: 1fr;">${optsHtml}</div>
      <div id="game-feedback"></div>
      <div id="solver-anim-area"></div>
    `;
  }
}

function startSpeedTimer() {
  stopSpeedTimer();
  gameSession.timerId = setInterval(function() {
    if (gameSession.answered) { stopSpeedTimer(); return; }
    gameSession.timeLeft -= 1;
    const badge = document.getElementById(`speed-timer-badge`);
    const bar = document.getElementById(`speed-bar`);
    if (badge) badge.textContent = `સમય: ${gameSession.timeLeft} સે.`;
    if (bar) bar.style.width = `${Math.max(0, (gameSession.timeLeft / 15) * 100)}%`;
    if (gameSession.timeLeft <= 0) {
      stopSpeedTimer();
      gameSession.answered = true;
      recordGameResult(false, 0);
      const q = gameSession.deck[gameSession.idx];
      const fb = document.getElementById(`game-feedback`);
      if (fb) {
        fb.innerHTML = `<div class="feedback-toast feedback-bad">⏰ સમય પૂરો! સાચો જવાબ: ${getAnswerDisplay(q[3], q[2])}<br><button type="button" class="btn btn-primary" style="margin-top:var(--space-sm);" onclick="nextGameQuestion()">આગળનો પ્રશ્ન ▶</button></div>`;
      }
    }
  }, 1000);
}

function answerStandardGame(chosenIdx) {
  if (gameSession.answered) return;
  gameSession.answered = true;
  stopSpeedTimer();

  const q = gameSession.deck[gameSession.idx];
  const right = isOptionCorrect(chosenIdx, q[3]);
  const g = appState.activeGame;

  for (let i = 0; i < 4; i++) {
    const btn = document.getElementById(`gopt-${i}`);
    if (!btn) continue;
    btn.disabled = true;
    if (isOptionCorrect(i, q[3])) btn.classList.add(`opt-right`);
    else if (i === chosenIdx) btn.classList.add(`opt-wrong`);
  }

  let bonus = 0;
  if (g === `speed` && right) bonus = Math.max(0, gameSession.timeLeft);
  if (g === `race` && right) {
    gameSession.racePos += 1;
    const car = document.getElementById(`race-car-icon`);
    if (car) car.style.left = `${Math.min(96, Math.round((gameSession.racePos / gameSession.raceTotal) * 100))}%`;
    if (gameSession.racePos >= gameSession.raceTotal) bonus = 25;
  }

  recordGameResult(right, bonus);

  if (g === `balloon`) {
    const bz = document.getElementById(`balloon-zone`);
    if (bz) {
      if (right) {
        bz.innerHTML = `<div class="balloon-pop">🎈🎉🎈 વાહ! બલૂન આકાશમાં ઊડ્યા! (+10 પોઇન્ટ) 🥳</div>`;
      } else {
        const funnyMsgs = [
          `🤪 અરેરે! ચિંતા નહીં, આગલી વખતે ચોક્કસ આવડશે! 💡 ટિપ: ${q[4][0]}`,
          `🙈 ઓહ! થોડું ચૂકી ગયા! 💡 ટિપ: ${q[4][0]}`,
          `🐢 ધીમે પણ મક્કમ! 💡 ટિપ: ${q[4][0]}`
        ];
        bz.innerHTML = `<div class="balloon-pop" style="font-size:1.1rem;">${funnyMsgs[Math.floor(Math.random() * funnyMsgs.length)]}</div>`;
      }
    }
  }

  const fb = document.getElementById(`game-feedback`);
  if (fb) {
    if (g === `race` && gameSession.racePos >= gameSession.raceTotal) {
      fb.innerHTML = `<div class="feedback-toast feedback-ok">🏆 અભિનંદન! તમે રેસ જીતી લીધી! (+35 પોઇન્ટ)<br><button type="button" class="btn btn-primary" style="margin-top:var(--space-sm);" onclick="nextGameQuestion()">નવી રેસ શરૂ કરો 🏁</button></div>`;
    } else {
      fb.innerHTML = `
        <div class="feedback-toast ${right ? `feedback-ok` : `feedback-bad`}">
          ${right ? `✔ શાબાશ! સાચો જવાબ (+${10 + bonus} પોઇન્ટ)` : `✖ ખોટો જવાબ! સાચો જવાબ: ${getAnswerDisplay(q[3], q[2])}`}
          <div style="margin-top:var(--space-xs); font-weight:600;">${q[4][0]}</div>
          <button type="button" class="btn btn-primary" style="margin-top:var(--space-sm);" onclick="nextGameQuestion()">આગળનો પ્રશ્ન ▶</button>
        </div>
      `;
    }
  }

  if (g === `solver`) {
    renderSolverSteps(q);
  }
}

function renderSolverSteps(q) {
  const area = document.getElementById(`solver-anim-area`);
  if (!area) return;
  const steps = q[4];
  let html = `<div class="step-cards">`;
  for (let i = 0; i < steps.length; i++) {
    html += `<div class="step-pill ${i <= gameSession.solverStep ? `step-active` : ``}">પગલું ${i + 1}: ${steps[i]}</div>`;
  }
  html += `</div>`;
  if (gameSession.solverStep < steps.length - 1) {
    html += `<button type="button" class="btn btn-secondary" style="margin-top:var(--space-md);" onclick="advanceSolverStep()">આગળનું સ્ટેપ એનિમેટ કરો ▶</button>`;
  }
  area.innerHTML = html;
}

function advanceSolverStep() {
  const q = gameSession.deck[gameSession.idx];
  if (gameSession.solverStep < q[4].length - 1) {
    gameSession.solverStep += 1;
    renderSolverSteps(q);
  }
}

// GAME 5: SHAPES FINDING PUZZLE GAME
function renderShapesGame(stage) {
  const puzzle = gameSession.shapeDeck[gameSession.idx];
  const letters = [`A`, `B`, `C`, `D`];
  let optsHtml = ``;
  for (let i = 0; i < puzzle.options.length; i++) {
    optsHtml += `
      <button type="button" class="game-opt-btn" id="sopt-${i}" onclick="answerShapeGame(${i})">
        <span class="opt-letter">${letters[i]}</span>
        <span>${puzzle.options[i]}</span>
      </button>
    `;
  }

  stage.innerHTML = `
    <div class="game-top-bar">
      <span class="badge badge-positive">🔺 આકાર શોધ પઝલ (${gameSession.idx + 1}/${gameSession.shapeDeck.length})</span>
      <button type="button" class="btn btn-soft" onclick="startGame('shapes')">નવી શફલ</button>
    </div>
    <p class="q-text">${puzzle.title}</p>
    <div class="shape-svg-wrap">
      <svg id="shape-puzzle-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 210" width="240" height="225" aria-label="આકાર ગણતરી આકૃતિ">
        ${puzzle.svgBase}
      </svg>
    </div>
    <div class="options-grid">${optsHtml}</div>
    <div id="shape-feedback"></div>
    <div id="shape-breakdown"></div>
  `;
}

function answerShapeGame(chosenIdx) {
  if (gameSession.answered) return;
  gameSession.answered = true;
  const puzzle = gameSession.shapeDeck[gameSession.idx];
  const right = chosenIdx === puzzle.ansIndex;

  for (let i = 0; i < puzzle.options.length; i++) {
    const btn = document.getElementById(`sopt-${i}`);
    if (!btn) continue;
    btn.disabled = true;
    if (i === puzzle.ansIndex) btn.classList.add(`opt-right`);
    else if (i === chosenIdx) btn.classList.add(`opt-wrong`);
  }

  recordGameResult(right, right ? 5 : 0);

  const fb = document.getElementById(`shape-feedback`);
  if (fb) {
    fb.innerHTML = `
      <div class="feedback-toast ${right ? `feedback-ok` : `feedback-bad`}">
        ${right ? `✔ અદ્ભુત! સાચો જવાબ: ${puzzle.options[puzzle.ansIndex]} (+15 પોઇન્ટ)` : `✖ સાચો જવાબ ${puzzle.options[puzzle.ansIndex]} છે. નીચે સ્ટેપ-બાય-સ્ટેપ જુઓ:`}
      </div>
    `;
  }
  gameSession.shapeStep = 0;
  renderShapeBreakdown();
}

function renderShapeBreakdown() {
  const puzzle = gameSession.shapeDeck[gameSession.idx];
  const svg = document.getElementById(`shape-puzzle-svg`);
  const bd = document.getElementById(`shape-breakdown`);
  if (!svg || !bd) return;

  const stepObj = puzzle.steps[gameSession.shapeStep];
  svg.innerHTML = puzzle.svgBase + stepObj.hl;

  let stepsHtml = `<div class="step-cards">`;
  for (let i = 0; i < puzzle.steps.length; i++) {
    stepsHtml += `<div class="step-pill ${i === gameSession.shapeStep ? `step-active` : ``}">${puzzle.steps[i].label}</div>`;
  }
  stepsHtml += `</div>`;

  const hasMore = gameSession.shapeStep < puzzle.steps.length - 1;
  bd.innerHTML = `
    ${stepsHtml}
    <div style="display:flex; flex-wrap:wrap; gap:var(--space-sm); margin-top:var(--space-md);">
      ${hasMore ? `<button type="button" class="btn btn-secondary" onclick="nextShapeHighlight()">આગળનો આકાર હાઇલાઇટ કરો ✨</button>` : ``}
      <button type="button" class="btn btn-primary" onclick="nextGameQuestion()">આગળની આકાર પઝલ ▶</button>
    </div>
  `;
}

function nextShapeHighlight() {
  const puzzle = gameSession.shapeDeck[gameSession.idx];
  if (gameSession.shapeStep < puzzle.steps.length - 1) {
    gameSession.shapeStep += 1;
    renderShapeBreakdown();
  }
}

// Initialization
async function initApp() {
  if (window.notebookAppApi && typeof window.notebookAppApi.getAppState === `function`) {
    try {
      const saved = await window.notebookAppApi.getAppState();
      if (saved) {
        if (saved.perPage) {
          appState.perPage = saved.perPage;
          const sel = document.getElementById(`per-page-select`);
          if (sel) sel.value = String(saved.perPage);
        }
        if (typeof saved.currentPage === `number`) appState.currentPage = saved.currentPage;
        if (typeof saved.points === `number`) appState.points = saved.points;
        if (typeof saved.streak === `number`) appState.streak = saved.streak;
        if (typeof saved.bestStreak === `number`) appState.bestStreak = saved.bestStreak;
      }
    } catch (e) {}
  }

  renderStudy();
  updateGamesHud();

  if (window.lucide && typeof window.lucide.createIcons === `function`) {
    window.lucide.createIcons();
  }
  if (window.notebookAppApi && typeof window.notebookAppApi.notifyAppReady === `function`) {
    window.notebookAppApi.notifyAppReady();
  }
}

document.addEventListener(`DOMContentLoaded`, initApp);
</script>
